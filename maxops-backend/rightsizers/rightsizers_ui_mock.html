let asgSelectedId = ASG_INSTANCES[0].id;
let asgSelectedTierByInstance = {};

function renderAsgRail() {
  const rail = document.getElementById("railAsg");
  rail.innerHTML = "";
  rail.appendChild(el("div", "rail-eyebrow", ASG_INSTANCES.length + " groups · V2 type + capacity · tests/test_asg_rightsizer_v2*.py + kept V1 scenarios"));
  ASG_INSTANCES.forEach((inst) => {
    const meta = classificationMeta(inst.classification);
    const btn = document.createElement("button");
    btn.className = "rail-item";
    btn.type = "button";
    btn.setAttribute("aria-current", String(inst.id === asgSelectedId));
    const def = inst.tiers && inst.tiers.default && inst.tiers[inst.tiers.default];
    let savingsHtml;
    if (inst.classification === "DEFERRED") savingsHtml = '<span class="rail-item-meta">' + escapeHtml((inst.deferredReasonCodes || [])[0] || "") + "</span>";
    else if (inst.classification === "INSUFFICIENT_DATA") savingsHtml = '<span class="rail-item-meta">' + escapeHtml((inst.blockingReasons || [])[0] || "") + "</span>";
    else if (inst.classification === "PREVIEW") savingsHtml = '<span class="rail-item-savings muted">preview only</span>';
    else if (inst.classification === "OPPORTUNITY") savingsHtml = '<span class="rail-item-savings muted">migration preview</span>';
    else if (def) savingsHtml = '<span class="rail-item-savings positive">' + fmtMoney(def.monthlySavings) + "/mo</span>";
    else savingsHtml = '<span class="rail-item-meta">no eligible reduction</span>';
    const typeChange = def && def.targetType && def.targetType !== inst.instanceType
      ? '<span class="rail-item-meta mono">→ ' + escapeHtml(def.targetType) + " · " + escapeHtml(def.optimizationKind) + "</span>"
      : def && def.targetType === inst.instanceType
        ? '<span class="rail-item-meta mono">' + escapeHtml(def.optimizationKind) + "</span>"
        : "";
    btn.innerHTML =
      '<span class="rail-item-top"><span class="rail-item-name">' + escapeHtml(inst.displayName) + '</span></span>' +
      '<span class="rail-item-meta mono">' + escapeHtml(inst.instanceType) + " · min " + inst.currentMin + "/desired " + inst.currentDesired + "/max " + inst.currentMax + '</span>' +
      typeChange +
      '<span class="rail-item-bottom">' + badgeHTML(meta.cls, meta.label) + savingsHtml + "</span>";
    btn.addEventListener("click", () => { asgSelectedId = inst.id; renderAsgRail(); renderAsgDetail(); });
    rail.appendChild(btn);
  });
}

function asgSelectedTier(inst) {
  if (!inst.tiers) return null;
  const preferred = asgSelectedTierByInstance[inst.id] || inst.tiers.default;
  if (preferred && inst.tiers[preferred]) return preferred;
  return ASG_TIER_ORDER.find((n) => inst.tiers[n]) || null;
}

function renderAsgDetail() {
  const inst = ASG_INSTANCES.find((i) => i.id === asgSelectedId);
  const root = document.getElementById("detailAsg");
  root.innerHTML = "";

  root.appendChild(asgBuildOutcomeHeader(inst));

  if (inst.classification === "DEFERRED") {
    root.appendChild(buildBanner("neutral", "Out of scope for V2", inst.deferredNote));
  }
  if (inst.classification === "INSUFFICIENT_DATA") {
    root.appendChild(buildBanner("rose", "Recommendation blocked", (inst.messages || [])[0] || "Required telemetry is unavailable."));
  }
  if (inst.classification === "CONDITIONAL") {
    root.appendChild(buildBanner("warning", "Review required before applying", "This recommendation is CONDITIONAL — read the warnings below before changing the instance type, MinSize, or DesiredCapacity."));
  }
  if (inst.classification === "PREVIEW") {
    root.appendChild(buildBanner("info", "Preview — not an executable recommendation", inst.savingsPreview.message));
  }
  if (inst.classification === "OPPORTUNITY") {
    root.appendChild(buildBanner("info", "Graviton migration opportunity — preview only", inst.savingsPreview.message));
  }
  if (inst.upgradeNote) {
    root.appendChild(buildBanner("neutral", "Instance-type optimization inactive for this group", inst.upgradeNote));
  }

  const hasTiers = inst.tiers && (inst.tiers.conservative || inst.tiers.balanced || inst.tiers.aggressive);
  if (hasTiers) {
    root.appendChild(asgBuildCapacityTable(inst));
    root.appendChild(asgBuildNestBars(inst));
    root.appendChild(asgBuildTierCards(inst, inst.tiers, false));
    if (inst.savingsPreview) root.appendChild(asgBuildPreviewSection(inst));
    root.appendChild(asgBuildSavingsBasisNote(inst));
  } else if (inst.savingsPreview) {
    root.appendChild(asgBuildCapacityTable(inst, inst.savingsPreview.options));
    root.appendChild(asgBuildNestBars({ ...inst, tiers: inst.savingsPreview.options }));
    root.appendChild(asgBuildTierCards(inst, inst.savingsPreview.options, true));
    if (inst.savingsPreview.retentionNote) root.appendChild(buildBanner("info", "Raw aggregate capacity retention", inst.savingsPreview.retentionNote));
    root.appendChild(asgBuildSavingsBasisNote(inst));
  } else {
    root.appendChild(asgBuildCapacityTable(inst));
  }

  if (inst.rejectionSummary) root.appendChild(asgBuildRejectionSummary(inst));

  if (inst.risk) {
    root.appendChild(buildRiskGrid(
      [{ key: "telemetry", label: "telemetry" }, { key: "compute", label: "compute" }, { key: "memory", label: "memory" },
       { key: "network", label: "network" }, { key: "storage", label: "storage" }, { key: "compatibility", label: "compatibility" },
       { key: "migration", label: "migration" }, { key: "operations", label: "operations" }],
      inst.risk, inst.reasonCodes,
      "Overall = highest non-null component risk. V2 collects no group network/EBS demand, so a type-changing option sets network and storage to null (rendered n/a, never LOW), carries " + ASG_TYPE_CHANGE_REASON + ", and is capped at CONDITIONAL. Same-architecture type changes set compatibility to MEDIUM; Graviton stays outside normal risk as an OPPORTUNITY preview."));
  }

  root.appendChild(asgBuildOperationalSignals(inst));
  if (inst.warnings) root.appendChild(buildWarningsCard("Warnings & required review", inst.warnings, "No warnings."));
  root.appendChild(asgBuildTelemetryCard(inst));
  root.appendChild(asgBuildCoverageCard(inst));
  root.appendChild(el("p", "foot-note", "ASG mock data — asg_rightsizer_spec.md (V2: instance type + capacity; MaxSize never changes); fixtures: tests/test_asg_rightsizer_v2*.py + tests/asg_rightsizer_helpers.py."));
}

function asgBuildPreviewSection(inst) {
  const wrap = el("div", "card preview-card");
  wrap.appendChild(el("div", "eyebrow", "Savings preview — " + escapeHtml(inst.savingsPreview.kind)));
  wrap.appendChild(el("div", "banner-body", escapeHtml(inst.savingsPreview.message)));
  wrap.appendChild(el("div", "decision-spec", "Blockers: " + escapeHtml((inst.savingsPreview.blockers || []).join(", ")) + ". A preview never enters recommendations or normal tiers."));
  const opts = inst.savingsPreview.options;
  ["conservative", "balanced", "aggressive"].forEach((name) => {
    const t = opts[name];
    if (!t) return;
    wrap.appendChild(el("div", "decision-spec mono",
      titleCase(name) + ": " + (t.targetType || "same type") + " · min " + t.targetMin + " / desired " + t.targetDesired + " / max " + t.targetMax +
      " · " + fmtMoney(t.monthlySavings) + "/mo (preview)"));
  });
  return wrap;
}

function asgBuildRejectionSummary(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Rejected candidates — rejection_summary"));
  const tags = el("div", "reason-codes");
  Object.entries(inst.rejectionSummary).forEach(([code, count]) => {
    tags.appendChild(el("span", "tag mono", escapeHtml(code) + " × " + count));
  });
  card.appendChild(tags);
  card.appendChild(el("div", "decision-spec", "Candidates excluded before the returned list: wrong architecture, ineligible family (.metal, burstable, disallowed class), unknown CPU capability, capacity increase required, or total-configuration savings below the floor. Tallies don't depend on candidate_limit or catalog order."));
  return card;
}

function asgBuildOutcomeHeader(inst) {
  const meta = classificationMeta(inst.classification);
  const card = el("div", "card");
  const head = el("div", "decision-head");
  const left = el("div");
  left.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><h2 style="font-size:1.1875rem;">' + escapeHtml(inst.displayName) + "</h2>" + badgeHTML(meta.cls, meta.label) + "</div>" +
    '<div class="decision-id"><span class="mono">' + escapeHtml(inst.resourceId) + "</span> · " + escapeHtml(inst.region) + " · account " + escapeHtml(inst.account) + "</div>";
  left.appendChild(el("div", "decision-types", '<span class="mono">' + escapeHtml(inst.instanceType) + "</span>"));
  left.appendChild(el("div", "decision-spec", inst.availabilityZones.length + " availability zones · " + escapeHtml(inst.availabilityZones.join(", "))));
  head.appendChild(left);

  const right = el("div", "savings-block");
  const def = inst.tiers && inst.tiers.default && inst.tiers[inst.tiers.default];
  if (inst.classification === "DEFERRED") {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.25rem;">No recommendation</div><div class="savings-reason">' + escapeHtml((inst.deferredReasonCodes || []).join(", ")) + "</div>";
  } else if (inst.classification === "INSUFFICIENT_DATA") {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.25rem;">No recommendation</div><div class="savings-reason">' + escapeHtml((inst.blockingReasons || []).join(", ")) + "</div>";
  } else if (inst.classification === "PREVIEW" || inst.classification === "OPPORTUNITY") {
    const previewDefault = inst.savingsPreview.options[inst.savingsPreview.options.default];
    right.innerHTML = '<div class="savings-figure" style="color:var(--info);font-size:1.5rem;">' + fmtMoney(previewDefault.monthlySavings) + "/mo (preview)</div><div class=\"savings-reason\">" +
      (inst.classification === "OPPORTUNITY" ? "Not executable — architecture migration must be validated first." : "Not executable — memory demand unverified.") + "</div>";
  } else if (def) {
    right.innerHTML = '<div class="savings-figure positive">' + fmtMoney(def.monthlySavings) + "/mo</div><div class=\"savings-sub\">" + fmtMoney(def.yearlySavings) + "/yr · total configuration</div>";
  } else {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.25rem;">No eligible reduction</div><div class="savings-reason">CURRENT_CAPACITY_NOT_OVERPROVISIONED</div>';
  }
  head.appendChild(right);
  card.appendChild(head);

  const defTypePart = def
    ? " → Balanced <span class=\"mono\">" + escapeHtml(def.targetType || inst.instanceType) + " · min=" + def.targetMin + ", desired=" + def.targetDesired + ", max=" + def.targetMax + "</span> (" + escapeHtml(def.optimizationKind) + "; max never changes)."
    : ".";
  card.appendChild(el("div", "outcome-sentence",
    "Current: <span class=\"mono\">" + escapeHtml(inst.instanceType) + " · min=" + inst.currentMin + ", desired=" + inst.currentDesired + ", max=" + inst.currentMax + "</span>" + defTypePart));
  return card;
}

function asgBuildCapacityTable(inst, tiersOverride) {
  const tiers = tiersOverride || inst.tiers || {};
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Configuration — current vs. tiers"));
  const table = el("table", "capacity-table");
  table.innerHTML =
    "<thead><tr><th>Configuration</th><th>Instance type</th><th>Kind</th><th>Min</th><th>Desired</th><th>Max</th></tr></thead>";
  const tbody = document.createElement("tbody");
  const curRow = el("tr", "current-row");
  curRow.innerHTML = "<td>Current</td><td>" + escapeHtml(inst.instanceType) + "</td><td>—</td><td>" + inst.currentMin + "</td><td>" + inst.currentDesired + "</td><td>" + inst.currentMax + " (unchanged in every option)</td>";
  tbody.appendChild(curRow);
  ["conservative", "balanced", "aggressive"].forEach((name) => {
    const t = tiers[name];
    const row = document.createElement("tr");
    if (!t) { row.className = "unavailable-row"; row.innerHTML = "<td>" + titleCase(name) + "</td><td colspan=\"5\">No option at this headroom</td>"; }
    else row.innerHTML = "<td>" + titleCase(name) + (t.satisfiedTiers && t.satisfiedTiers.length > 1 ? " · " + t.satisfiedTiers.filter((s) => s !== name).map(titleCase).join(" · ") : "") + "</td><td>" + escapeHtml(t.targetType || inst.instanceType + " (unchanged)") + "</td><td>" + escapeHtml(t.optimizationKind || "") + "</td><td>" + t.targetMin + "</td><td>" + t.targetDesired + "</td><td>" + t.targetMax + "</td>";
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  const scroll = el("div", "chart-scroll");
  scroll.appendChild(table);
  card.appendChild(scroll);
  if (inst.tiersNote) card.appendChild(el("div", "decision-spec", inst.tiersNote));
  card.appendChild(el("div", "decision-spec", "V2 optimizes the EC2 instance type together with MinSize and DesiredCapacity. target_max_size always equals current MaxSize — the ceiling is never changed. Optimization kinds: CAPACITY_ONLY (same type, lower count) · INSTANCE_ONLY (new type, same count) · COMBINED (new type, lower count)."));
  return card;
}

function asgBuildNestBars(inst) {
  const tiers = inst.tiers || {};
  const presentTypes = new Set(["conservative", "balanced", "aggressive"]
    .map((n) => tiers[n]).filter(Boolean).map((t) => t.targetType || inst.instanceType));
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Nested tier invariant"));
  if (presentTypes.size > 1) {
    card.appendChild(el("div", "decision-spec", "Tiers resolve to different target instance types, so counts are deliberately NOT compared here — per-instance capacity differs across types, and the nesting invariant only applies within one target type (spec §8)."));
    return card;
  }
  card.appendChild(el("div", "decision-spec", "Conservative ≥ Balanced ≥ Aggressive, for both Min and Desired — never violated for identical input and one target type."));
  const wrap = el("div", "nest-bars");
  ["Min", "Desired"].forEach((field) => {
    const key = "target" + field;
    const max = inst.currentDesired;
    ["conservative", "balanced", "aggressive"].forEach((name) => {
      const t = tiers[name];
      const row = el("div", "nest-bar-row");
      const value = t ? t[key] : null;
      const pct = value != null ? clamp((value / max) * 100, 3, 100) : 0;
      row.innerHTML =
        '<span>' + titleCase(name) + " " + field + '</span>' +
        '<span class="nest-track"><span class="nest-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="mono" style="text-align:right;">' + (value != null ? value : "—") + '</span>';
      wrap.appendChild(row);
    });
  });
  card.appendChild(wrap);
  return card;
}

function asgBuildTierCards(inst, tiers, isPreview) {
  const section = el("section", "tier-section");
  const heading = el("div", "tier-heading");
  heading.innerHTML = '<div class="eyebrow">' + (isPreview ? "CPU-only preview options" : "Recommendation options") + '</div><div class="tier-heading-note">Choose savings vs. headroom · Balanced is recommended</div>';
  section.appendChild(heading);
  const grid = el("div", "tier-grid");
  const activeTier = asgSelectedTier({ ...inst, tiers });
  ["conservative", "balanced", "aggressive"].forEach((name) => {
    const t = tiers[name];
    if (!t) {
      const unavailable = el("div", "tier-card unavailable");
      unavailable.innerHTML = '<span class="tier-name">' + titleCase(name) + '</span><span class="tier-metric-value">No option at this headroom</span>';
      grid.appendChild(unavailable);
      return;
    }
    const meta = classificationMeta(t.classification);
    const button = el("button", "tier-card" + (isPreview ? " preview-card" : ""));
    button.type = "button";
    if (name === activeTier) button.classList.add("selected");
    if (name === tiers.default) button.classList.add("default-tier");
    const typeLine = t.targetType
      ? escapeHtml(t.targetType) + (t.familyChanged ? " (family change)" : t.targetType === inst.instanceType ? " (unchanged)" : "")
      : escapeHtml(inst.instanceType) + " (type unchanged — V1 envelope)";
    const performanceGain = t.performanceChangePct != null && t.performanceChangePct > 0
      ? '<span class="tier-performance-gain">' + fmtPerformanceChange(t.performanceChangePct) + " CPU performance</span>" +
        '<span class="tier-caveat">Modeled CoreMark CPU throughput only — not application performance; V2 hasn\'t validated network/storage for a new type.</span>'
      : "";
    button.innerHTML =
      '<span class="tier-card-top"><span class="tier-name">' + titleCase(name) + (t.satisfiedTiers && t.satisfiedTiers.length > 1 ? " · " + t.satisfiedTiers.filter((s) => s !== name).map(titleCase).join(" · ") : "") + "</span>" + badgeHTML(meta.cls, meta.label) + "</span>" +
      '<span class="tier-target mono">' + typeLine + "</span>" +
      '<span class="decision-spec mono">min ' + t.targetMin + " · desired " + t.targetDesired + " · max " + t.targetMax + " · " + escapeHtml(t.optimizationKind || "") + "</span>" +
      '<span class="tier-savings">' + fmtMoney(t.monthlySavings) + "/mo " + (isPreview ? "(preview)" : "total-configuration savings") + "</span>" +
      performanceGain +
      '<span class="tier-metrics">' +
        '<span><span class="tier-metric-label">Max projected utilization</span><span class="tier-metric-value mono">' + (t.projectedUtil != null ? Math.round(t.projectedUtil * 100) + "%" : "n/a — unmeasured dimension excluded") + "</span></span>" +
        '<span><span class="tier-metric-label">Binding dimension</span><span class="tier-metric-value">' + (t.bindingDimension ? "Limited by " + escapeHtml(t.bindingDimension) : "n/a") + "</span></span>" +
        '<span><span class="tier-metric-label">CPU capacity basis</span><span class="tier-metric-value mono">' + (t.cpuCapacityBasis || "n/a") + "</span></span>" +
        '<span><span class="tier-metric-label">Unit price</span><span class="tier-metric-value mono">' + fmtMoney(t.targetUnitPrice, { cents: false }) + "/mo</span></span>" +
      "</span>" +
      (t.reasonCodes && t.reasonCodes.length ? '<span class="tier-caveat">' + escapeHtml(t.reasonCodes.join(", ")) + "</span>" : "");
    button.addEventListener("click", () => { asgSelectedTierByInstance[inst.id] = name; renderAsgDetail(); });
    grid.appendChild(button);
  });
  section.appendChild(grid);
  return section;
}

function asgBuildSavingsBasisNote(inst) {
  const def = (inst.tiers && inst.tiers.default && inst.tiers[inst.tiers.default]) ||
    (inst.savingsPreview && inst.savingsPreview.options[inst.savingsPreview.options.default]);
  const note = el("div", "card");
  note.appendChild(el("div", "eyebrow", "Savings basis"));
  note.innerHTML +=
    '<div class="savings-basis-note">' +
    '<div><span class="mono">savings_basis: "initial_target_configuration"</span></div>' +
    '<div style="margin-top:6px;">Total-configuration economics, calculated once: <span class="mono">current_desired × current_unit_price − target_desired × target_unit_price</span>' +
    (def ? ' = <span class="mono">' + inst.currentDesired + " × " + fmtMoney(inst.unitMonthlyPrice) + " − " + def.targetDesired + " × " + fmtMoney(def.targetUnitPrice) + " = " + fmtMoney(def.monthlySavings) + "/mo</span>" : "") +
    '. An instance-type saving is never added to a count saving — a higher unit price can still be the cheaper total. This is the immediate configuration cost, not a promise the group stays at that capacity: scaling policies may change desired capacity within the unchanged min/max bounds (<span class="mono">scaling_policy_may_change_realized_savings: true</span>).</div>' +
    "</div>";
  return note;
}

function asgBuildOperationalSignals(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Operational signals"));
  const list = el("div", "signal-list");
  const sig = inst.operationalSignals;
  const dyn = inst.dynamicPolicy;
  if (!sig) {
    card.appendChild(el("div", "empty-note", "Not evaluated — this group was deferred or blocked before operational-signal evaluation."));
    return card;
  }
  const rows = [
    ["Recent scaling failure", sig.scaling_failure_seen, "RECENT_SCALING_FAILURE_REQUIRES_REVIEW"],
    ["Recent capacity shortage", sig.capacity_shortage_seen, "RECENT_CAPACITY_SHORTAGE_REQUIRES_REVIEW"],
    ["Desired/in-service mismatch", sig.desired_in_service_mismatch_seen, "DESIRED_IN_SERVICE_MISMATCH_REQUIRES_REVIEW"],
    ["Capacity Rebalance enabled", !!sig.capacity_rebalance, "CAPACITY_REBALANCE_REQUIRES_REVIEW"],
  ];
  rows.forEach(([label, on, code]) => {
    const row = el("div", "signal-row" + (on ? "" : " clear"));
    row.innerHTML = '<span class="signal-dot ' + (on ? "on" : "off") + '"></span><span>' + escapeHtml(label) + (on ? " — " + escapeHtml(code) : " — clear") + "</span>";
    list.appendChild(row);
  });
  const dynRow = el("div", "signal-row" + (dyn && dyn.kinds && dyn.kinds.includes("TargetTrackingScaling") && dyn.metrics && dyn.metrics.every((m) => m.indexOf("CPU") !== -1) ? " clear" : ""));
  dynRow.innerHTML = dyn ? '<span class="signal-dot off"></span><span>Dynamic policy: ' + escapeHtml((dyn.kinds || []).join(", ")) + " on " + escapeHtml((dyn.metrics || []).join(", ")) + "</span>" : '<span class="signal-dot on"></span><span>No dynamic scaling policy identified — NO_DYNAMIC_SCALING_POLICY_REQUIRES_REVIEW</span>';
  list.appendChild(dynRow);
  card.appendChild(list);
  card.appendChild(el("div", "decision-spec", "A non-CPU scaling signal, desired-history gap, capacity rebalance, or recoverable recent failure caps the option at CONDITIONAL rather than ACTIONABLE — it never blocks the calculation outright."));
  return card;
}

function asgBuildTelemetryCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Telemetry disclosure"));
  const grid = el("div", "telemetry-grid");
  const labels = { cpu_percent: "CPU utilization", memory_percent: "Memory utilization", desired_capacity: "Desired capacity history", in_service_instances: "In-service instances" };
  Object.keys(inst.telemetry || {}).forEach((k) => {
    const t = inst.telemetry[k];
    const absent = t.present === false;
    const cell = el("div", "telemetry-cell" + (absent ? " absent" : t.thin_data ? " thin" : ""));
    let body = '<div class="telemetry-metric">' + labels[k] + "</div>";
    if (absent) body += '<div class="telemetry-flag absent"><span class="dot"></span>Not present</div>';
    else {
      body += '<div class="telemetry-days">~' + t.observed_days + " days</div>";
      body += t.thin_data ? '<div class="telemetry-flag"><span class="dot"></span>Thin data</div>' : '<div class="decision-spec">present' + (t.pairing_ratio != null ? ", pairing " + Math.round(t.pairing_ratio * 100) + "%" : "") + "</div>";
    }
    cell.innerHTML = body;
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  return card;
}

function asgBuildCoverageCard(inst) {
  const v2 = inst.policyVersion === "asg-v2-combined";
  const rows = [
    ["Availability floor", inst.availabilityZones.length, false],
    ["Tier ratios", "0.55 / 0.70 / 0.85", false],
    ["Policy version (capacity_policy)", inst.policyVersion || "asg-v2-combined", false],
    ["candidate_policy present", v2],
    ["candidate_limit", v2 ? 10 : "n/a (V1 envelope)", false],
    ["Availability validated", "false — target-type availability in this region/AZs is not checked", false],
  ];
  if (inst.upgradeNote) rows.push(["Instance optimization", "inactive — ASG_INSTANCE_OPTIMIZATION_TELEMETRY_UPGRADE_REQUIRED", false]);
  return buildCoverageDetails(rows,
    "ASG V2 is read-only: it recommends an instance type plus MinSize/DesiredCapacity but never updates the group, its launch template, or CloudWatch metrics collection, and never changes MaxSize. availability_note: instance-type availability and launch capacity are not validated by this recommendation.",
    inst.sourceTest);
}

}

function renderRdsRail() {
  const rail = document.getElementById("railRds");
  rail.innerHTML = "";
  rail.appendChild(el("div", "rail-eyebrow", RDS_INSTANCES.length + " databases · tests/test_rds_rightsizer_v1.py scenarios"));
  RDS_INSTANCES.forEach((inst) => {
    const meta = classificationMeta(inst.classification == null ? "NONE" : inst.classification);
    const btn = document.createElement("button");
    btn.className = "rail-item";
    btn.type = "button";
    btn.setAttribute("aria-current", String(inst.id === rdsSelectedId));
    let savingsHtml;
    if (inst.classification === "DEFERRED") savingsHtml = '<span class="rail-item-meta">' + escapeHtml((inst.deferredReasonCodes || [])[0] || "") + "</span>";
    else if (inst.classification == null) savingsHtml = '<span class="rail-item-savings muted">no savings found</span>';
    else {
      const def = inst.classKind && inst.classKind.tiers && inst.classKind.tiers.default && inst.classKind.tiers[inst.classKind.tiers.default];
      const candidate = inst.classKind && inst.classKind.candidates && inst.classKind.candidates[0];
      const storage = inst.storageKind && inst.storageKind.status === "RECOMMENDED" ? inst.storageKind : null;
      if (def) savingsHtml = '<span class="rail-item-savings positive">' + fmtMoney(def.monthlySavings) + "/mo class</span>";
      else if (candidate) savingsHtml = '<span class="rail-item-savings positive">' + fmtMoney(candidate.monthlySavings) + "/mo (capacity-retaining)</span>";
      else if (storage) savingsHtml = '<span class="rail-item-savings positive">' + fmtMoney(storage.monthlySavings) + "/mo storage</span>";
      else savingsHtml = '<span class="rail-item-meta">see detail</span>';
    }
    btn.innerHTML =
      '<span class="rail-item-top"><span class="rail-item-name">' + escapeHtml(inst.id) + '</span><span class="rail-item-meta mono">' + escapeHtml(inst.engine) + '</span></span>' +
      '<span class="rail-item-meta mono">' + escapeHtml(inst.current.dbClass) + " · " + escapeHtml(inst.region) + (inst.multiAz ? " · Multi-AZ" : "") + '</span>' +
      '<span class="rail-item-bottom">' + badgeHTML(meta.cls, meta.label) + savingsHtml + "</span>";
    btn.addEventListener("click", () => { rdsSelectedId = inst.id; renderRdsRail(); renderRdsDetail(); });
    rail.appendChild(btn);
  });
}

function rdsSelectedTier(inst) {
  if (!inst.classKind || !inst.classKind.tiers) return null;
  const tiers = inst.classKind.tiers;
  const preferred = rdsSelectedTierByInstance[inst.id] || tiers.default;
  if (preferred && tiers[preferred]) return preferred;
  return ["conservative", "balanced", "aggressive"].find((n) => tiers[n]) || null;
}

const RDS_STATUS_META = {
  RECOMMENDED: { cls: "good", label: "Recommended" },
  NO_RECOMMENDATION: { cls: "neutral", label: "No recommendation" },
  INSUFFICIENT_DATA: { cls: "rose", label: "Insufficient data" },
  NOT_APPLICABLE: { cls: "neutral", label: "Not applicable" },
  DEFERRED: { cls: "neutral", label: "Deferred" },
};
function rdsStatusPill(status) {
  const meta = RDS_STATUS_META[status] || { cls: "neutral", label: status };
  return '<span class="status-pill"><span class="dot" style="background:var(--' + meta.cls + ')"></span>' + escapeHtml(meta.label) + "</span>";
}

function renderRdsDetail() {
  const inst = RDS_INSTANCES.find((i) => i.id === rdsSelectedId);
  const root = document.getElementById("detailRds");
  root.innerHTML = "";

  root.appendChild(rdsBuildOutcomeHeader(inst));

  if (inst.classification === "DEFERRED") {
    root.appendChild(buildBanner("neutral", "Out of scope / not currently evaluable", inst.deferredNote));
    if (inst.classKind) root.appendChild(rdsBuildClassCard(inst));
    if (inst.storageKind) root.appendChild(rdsBuildStorageCard(inst));
    root.appendChild(el("p", "foot-note", "RDS mock data — rds_rightsizer_ui_spec.md; fixture: " + inst.sourceTest));
    return;
  }
  if (inst.classification === "CONDITIONAL") {
    root.appendChild(buildBanner("warning", "Review required before applying",
      "This recommendation is CONDITIONAL — it is never safe, approved, or ready to apply without the review noted below."));
  }
  if (inst.telemetry && Object.values(inst.telemetry).some((t) => t.thin_data)) {
    root.appendChild(buildBanner("warning", "Thin telemetry",
      "Observed history is short and/or sparse for one or more metrics. This renders as a CONDITIONAL recommendation with the reason disclosed — never a silent empty state."));
  }
  if (inst.multiAz) {
    root.appendChild(buildBanner("info", "Multi-AZ failover on class change",
      "Changing the instance class on a Multi-AZ deployment triggers a failover to the standby, a brief connection interruption, and a DNS endpoint change during cutover."));
  }

  if (inst.classKind) root.appendChild(rdsBuildClassCard(inst));
  if (inst.storageKind) root.appendChild(rdsBuildStorageCard(inst));
  if (inst.evidence) root.appendChild(rdsBuildCapacityEvidence(inst));
  else if (inst.classKind && inst.classKind.candidates) {
    const card = el("div", "card");
    card.appendChild(el("div", "eyebrow", "Capacity evidence"));
    card.appendChild(el("div", "empty-note", "CPU and FreeableMemory are both absent for this database. There is nothing to plot or rescale — the candidate above retains full current vCPU and memory capacity instead of an estimated ratio."));
    root.appendChild(card);
  }
  if (inst.dbLoad) root.appendChild(rdsBuildDbLoadPanel(inst));
  if (inst.risk) {
    root.appendChild(buildRiskGrid(
      [{ key: "telemetry", label: "telemetry" }, { key: "compute", label: "compute" }, { key: "memory", label: "memory" },
       { key: "dbload", label: "DB load" }, { key: "storage", label: "storage" }, { key: "network", label: "network" },
       { key: "connections", label: "connections" }, { key: "compatibility", label: "compatibility" }, { key: "operations", label: "operations" }],
      inst.risk, inst.reasonCodes));
  }
  root.appendChild(buildWarningsCard("Warnings & required review", inst.warnings, "No warnings — every dimension cleared with ample headroom."));
  root.appendChild(rdsBuildTelemetryCard(inst));
  root.appendChild(rdsBuildCoverageCard(inst));
  root.appendChild(el("p", "foot-note", "RDS mock data — rds_rightsizer_ui_spec.md; fixture: " + inst.sourceTest));
}

function rdsBuildOutcomeHeader(inst) {
  const meta = classificationMeta(inst.classification == null ? "NONE" : inst.classification);
  const card = el("div", "card");
  const head = el("div", "decision-head");
  const left = el("div");
  left.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><h2 style="font-size:1.1875rem;">' + escapeHtml(inst.resourceName) + "</h2>" + badgeHTML(meta.cls, meta.label) + "</div>" +
    '<div class="decision-id"><span class="mono">' + escapeHtml(inst.resourceId) + "</span> · " + escapeHtml(inst.region) + " · " + escapeHtml(inst.state) + "</div>";
  left.appendChild(el("div", "decision-types", '<span class="mono">' + escapeHtml(inst.engine) + " " + escapeHtml(inst.engineVersion) + '</span><span class="decision-spec" style="margin:0 0 0 8px;">' + (inst.multiAz ? "Multi-AZ" : "Single-AZ") + (inst.readReplica ? " · read replica" : "") + "</span>"));
  left.appendChild(el("div", "decision-spec", escapeHtml(inst.current.dbClass) + " · " + inst.current.vcpus + " vCPU / " + inst.current.memGib + " GiB · " + fmtMoney(inst.current.monthlyCost) + "/mo · " + escapeHtml(inst.licenseModel)));
  head.appendChild(left);

  const right = el("div", "savings-block");
  const tier = rdsSelectedTier(inst);
  const tierOpt = tier && inst.classKind.tiers[tier];
  if (inst.classification === "DEFERRED") {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.25rem;">No recommendation</div><div class="savings-reason">' + escapeHtml((inst.deferredReasonCodes || []).join(", ")) + "</div>";
  } else if (inst.classification == null) {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.125rem;">No cost-saving recommendation</div><div class="savings-reason">found under the current policy</div>';
  } else if (tierOpt) {
    right.innerHTML = '<div class="savings-figure positive">' + fmtMoney(tierOpt.monthlySavings) + "/mo</div><div class=\"savings-sub\">" + fmtMoney(tierOpt.yearlySavings) + "/yr · class change</div>";
  } else if (inst.classKind && inst.classKind.candidates && inst.classKind.candidates[0]) {
    const c = inst.classKind.candidates[0];
    right.innerHTML = '<div class="savings-figure positive">' + fmtMoney(c.monthlySavings) + "/mo</div><div class=\"savings-sub\">capacity-retaining candidate</div>";
  } else if (inst.storageKind && inst.storageKind.status === "RECOMMENDED") {
    right.innerHTML = '<div class="savings-figure positive">' + fmtMoney(inst.storageKind.monthlySavings) + "/mo</div><div class=\"savings-sub\">storage only</div>";
  } else {
    right.innerHTML = '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.125rem;">No cost-saving recommendation</div>';
  }
  head.appendChild(right);
  card.appendChild(head);

  let sentence;
  if (inst.classification === "DEFERRED") sentence = "";
  else if (inst.classification == null) sentence = "No cost-saving RDS rightsizing recommendation was found under the current policy.";
  else if (tierOpt) sentence = titleCase(tier) + ": <span class=\"mono\">" + escapeHtml(inst.current.dbClass) + "</span> → <span class=\"mono\">" + escapeHtml(tierOpt.targetClass) + "</span>, saving about " + fmtMoney(tierOpt.monthlySavings) + "/month.";
  else if (inst.classKind && inst.classKind.candidates && inst.classKind.candidates[0]) sentence = "Conditional: a capacity-retaining class swap is available, but standard CPU/memory evidence couldn't be measured to size it more aggressively.";
  else if (inst.storageKind && inst.storageKind.status === "RECOMMENDED") sentence = "Storage: keep " + inst.storageKind.current.allocatedGib + " GiB and reduce " + inst.storageKind.current.type + " provisioned performance to " + inst.storageKind.target.iops.toLocaleString() + " IOPS / " + inst.storageKind.target.throughputMibps + " MiB/s, saving about " + fmtMoney(inst.storageKind.monthlySavings) + "/month.";
  else sentence = "No cost-saving RDS rightsizing recommendation was found under the current policy.";
  if (sentence) card.appendChild(el("div", "outcome-sentence", sentence));
  return card;
}

function rdsBuildClassCard(inst) {
  const kind = inst.classKind;
  const card = el("div", "card");
  const head = el("div", "kind-status-row");
  head.innerHTML = '<span class="eyebrow" style="margin:0;">Instance class — DB_INSTANCE_CLASS_CHANGE</span>' + rdsStatusPill(kind.status);
  card.appendChild(head);

  if (kind.status === "NOT_APPLICABLE" || kind.status === "NO_RECOMMENDATION") {
    card.appendChild(el("div", "empty-note", kind.note || ((kind.reasonCodes || []).join(", ") || "Not evaluated for this database.")));
    return card;
  }
  if (kind.tiers) {
    const section = el("section", "tier-section");
    section.appendChild(el("div", "tier-heading-note", "Compute-only utilization — no performance-delta badge (core spec §8: RDS declines cross-class CoreMark-style performance modeling)."));
    const grid = el("div", "tier-grid");
    const active = rdsSelectedTier(inst);
    ["conservative", "balanced", "aggressive"].forEach((name) => {
      const t = kind.tiers[name];
      if (!t) { const u = el("div", "tier-card unavailable"); u.innerHTML = '<span class="tier-name">' + titleCase(name) + '</span><span class="tier-metric-value">No option at this headroom</span>'; grid.appendChild(u); return; }
      const meta = classificationMeta(t.classification);
      const button = el("button", "tier-card");
      button.type = "button";
      if (name === active) button.classList.add("selected");
      if (name === kind.tiers.default) button.classList.add("default-tier");
      button.innerHTML =
        '<span class="tier-card-top"><span class="tier-name">' + titleCase(name) + (t.satisfiedTiers.length > 1 ? " · " + t.satisfiedTiers.filter((s) => s !== name).map(titleCase).join(" · ") : "") + "</span>" + badgeHTML(meta.cls, meta.label) + "</span>" +
        '<span class="tier-target mono">' + escapeHtml(t.targetClass) + "</span>" +
        '<span class="decision-spec">' + t.vcpus + " vCPU / " + t.memGib + " GiB · " + fmtMoney(t.monthlyCost) + "/mo</span>" +
        '<span class="tier-savings">' + fmtMoney(t.monthlySavings) + "/mo savings</span>" +
        '<span class="tier-metrics">' +
          '<span><span class="tier-metric-label">Max projected utilization</span><span class="tier-metric-value mono">' + Math.round(t.projectedUtil * 100) + "%</span></span>" +
          '<span><span class="tier-metric-label">Binding dimension</span><span class="tier-metric-value">' + escapeHtml(t.bindingDimension) + "</span></span>" +
        "</span>" +
        (t.reasonCodes.length ? '<span class="tier-caveat">' + escapeHtml(t.reasonCodes.join(", ")) + "</span>" : "");
      button.addEventListener("click", () => { rdsSelectedTierByInstance[inst.id] = name; renderRdsDetail(); });
      grid.appendChild(button);
    });
    section.appendChild(grid);
    card.appendChild(section);
  } else if (kind.candidates) {
    card.appendChild(el("div", "tier-heading-note", "Both CPU and FreeableMemory are unmeasured, so every tier is null. This capacity-retaining candidate below is shown instead — it keeps the current vCPU/memory shape rather than estimating a smaller one."));
    const grid = el("div", "tier-grid");
    kind.candidates.forEach((c) => {
      const meta = classificationMeta(c.classification);
      const card2 = el("div", "tier-card default-tier");
      card2.innerHTML =
        '<span class="tier-card-top"><span class="tier-name">Capacity-retaining</span>' + badgeHTML(meta.cls, meta.label) + "</span>" +
        '<span class="tier-target mono">' + escapeHtml(c.targetClass) + "</span>" +
        '<span class="decision-spec">' + c.vcpus + " vCPU / " + c.memGib + " GiB · " + fmtMoney(c.monthlyCost) + "/mo</span>" +
        '<span class="tier-savings">' + fmtMoney(c.monthlySavings) + "/mo savings</span>" +
        '<span class="tier-metrics"><span><span class="tier-metric-label">Max projected utilization</span><span class="tier-metric-value">unknown — capacity retained</span></span></span>' +
        '<span class="tier-caveat">' + escapeHtml(c.reasonCodes.join(", ")) + "</span>";
      grid.appendChild(card2);
    });
    card.appendChild(grid);
  }
  return card;
}

function rdsBuildStorageCard(inst) {
  const kind = inst.storageKind;
  const card = el("div", "card");
  const head = el("div", "kind-status-row");
  head.innerHTML = '<span class="eyebrow" style="margin:0;">Storage configuration — STORAGE_CONFIGURATION_CHANGE</span>' + rdsStatusPill(kind.status);
  card.appendChild(head);
  if (kind.status !== "RECOMMENDED") {
    card.appendChild(el("div", "empty-note", kind.note || ((kind.reasonCodes || []).join(", ") || "Not evaluated for this database.")));
    return card;
  }
  const table = el("table", "storage-table");
  table.innerHTML =
    "<thead><tr><th>Setting</th><th>Current</th><th>Recommended</th></tr></thead>" +
    "<tbody>" +
    "<tr><td>Type</td><td class=\"num\">" + escapeHtml(kind.current.type) + "</td><td class=\"num\">" + escapeHtml(kind.target.type) + "</td></tr>" +
    "<tr><td>Allocated storage</td><td class=\"num\">" + kind.current.allocatedGib + " GiB</td><td class=\"num unchanged\">" + kind.target.allocatedGib + " GiB (unchanged)</td></tr>" +
    "<tr><td>IOPS</td><td class=\"num\">" + kind.current.iops.toLocaleString() + "</td><td class=\"num\">" + kind.target.iops.toLocaleString() + "</td></tr>" +
    "<tr><td>Throughput</td><td class=\"num\">" + kind.current.throughputMibps + " MiB/s</td><td class=\"num\">" + kind.target.throughputMibps + " MiB/s</td></tr>" +
    "</tbody>";
  const scroll = el("div", "chart-scroll");
  scroll.appendChild(table);
  card.appendChild(scroll);
  card.appendChild(el("div", "decision-spec", "RDS doesn't support reducing allocated storage. This option changes only paid storage performance and/or storage type — " + fmtMoney(kind.monthlySavings) + "/mo, " + fmtMoney(kind.yearlySavings) + "/yr."));
  card.appendChild(el("div", "decision-spec", "Class and storage are independent recommendations — savings are never added together, and applying one doesn't require the other."));
  return card;
}

function rdsBuildCapacityEvidence(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Capacity evidence"));
  const tier = rdsSelectedTier(inst);
  const tierOpt = tier && inst.classKind.tiers && inst.classKind.tiers[tier];
  const ev = inst.evidence;

  if (tierOpt) {
    const targetHeadroomX = round1(100 / (tierOpt.projectedUtil * 100));
    const p = el("div", "headroom-sentence");
    p.innerHTML = "Over the last " + ev.cpuDays + " observed days, CPU ran at <strong class=\"mono\">~" + ev.cpuObservedPct + "%</strong> of the current instance. On the selected <strong class=\"mono\">" + escapeHtml(tierOpt.targetClass) + "</strong> that projects to <strong class=\"mono\">" + Math.round(tierOpt.projectedUtil * 100) + "%</strong> — about <strong class=\"mono\">" + targetHeadroomX + "×</strong> headroom against the tier's target.";
    card.appendChild(p);
    const legend = el("div", "chart-legend");
    legend.innerHTML = '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);height:3px;"></span>Maximum (on target)</span><span class="chart-legend-item"><span class="swatch" style="background:var(--accent);opacity:0.55;height:2px;"></span>p99 (on target)</span><span class="chart-legend-item"><span class="swatch dashedline"></span>p95 (on target)</span>';
    card.appendChild(legend);
    const scroll = el("div", "chart-scroll");
    const wrap = el("div", "chart-wrap");
    wrap.style.height = "260px";
    scroll.appendChild(wrap);
    card.appendChild(scroll);
    card.appendChild(el("div", "chart-caption", "Rescaled to " + escapeHtml(tierOpt.targetClass) + " — 100% is that class's ceiling. Same target-scaled construction as the EC2 tab's Chart A."));
    const cpuProfile = { seed: inst.id + "-cpu", baseline: Math.max(4, ev.cpuObservedPct - 6), noiseAmp: 3.5, spikeChance: 0.02, spikeAmp: 8, min: 3, max: Math.min(70, ev.cpuObservedPct + 20), daysAvailable: Math.min(TOTAL_DAYS, Math.max(30, Math.round(ev.cpuDays * 20))) };
    requestAnimationFrame(() => renderTrendChart(wrap, { profile: cpuProfile, dw: { headroomX: targetHeadroomX }, hasTarget: true, metric: "CPU" }));

    const usedGib = inst.current.memGib - ev.currentFreeGib;
    const projectedFreeGib = round1(tierOpt.memGib - usedGib);
    const projectedUsedPct = Math.round((usedGib / tierOpt.memGib) * 100);
    const memP = el("div", "headroom-sentence");
    memP.innerHTML = "Freeable memory: currently <strong class=\"mono\">" + ev.currentFreeGib + " GiB</strong> free of " + inst.current.memGib + " GiB. Projected onto " + escapeHtml(tierOpt.targetClass) + " (" + tierOpt.memGib + " GiB): <strong class=\"mono\">" + projectedFreeGib + " GiB</strong> free (~" + projectedUsedPct + "% used).";
    card.appendChild(memP);
    const memLegend = el("div", "chart-legend");
    memLegend.innerHTML = '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);height:3px;"></span>Projected free on target</span><span class="chart-legend-item"><span class="swatch" style="background:var(--ink-muted);opacity:0.7;height:2px;"></span>Current free (context)</span>';
    card.appendChild(memLegend);
    const memScroll = el("div", "chart-scroll");
    const memWrap = el("div", "chart-wrap");
    memWrap.style.height = "240px";
    memScroll.appendChild(memWrap);
    card.appendChild(memScroll);
    card.appendChild(el("div", "chart-caption", "Absolute GiB, never percent-rescaled. Each historical daily-minimum point is projected as target_memory − estimated_used_memory; negative values are never clamped — they truthfully show the modeled working set wouldn't fit. The floor is the absolute policy free-memory minimum."));
    const floorGib = round1(Math.max(1.5, tierOpt.memGib * 0.10));
    requestAnimationFrame(() => renderMemoryFloorChart(memWrap, {
      seed: inst.id + "-mem", currentMemoryGib: inst.current.memGib, targetMemoryGib: tierOpt.memGib,
      usedBaselineGib: usedGib, noiseGib: Math.max(0.4, usedGib * 0.12), spikeGib: usedGib * 0.5, floorGib, daysAvailable: 60,
    }));
  } else {
    card.appendChild(el("div", "empty-note", "The selected candidate retains current capacity rather than projecting onto a smaller class — there is no target ceiling to chart against."));
  }

  const table = el("table", "evidence-table");
  const netRxLabel = ev.networkRxMbps < 0.01 ? ev.networkRxMbps.toFixed(5) : ev.networkRxMbps.toFixed(2);
  const netTxLabel = ev.networkTxMbps < 0.01 ? ev.networkTxMbps.toFixed(5) : ev.networkTxMbps.toFixed(2);
  table.innerHTML =
    "<thead><tr><th>Dimension</th><th>Observed</th><th>Projected on target</th><th>Target / headroom</th><th>Status</th></tr></thead><tbody>" +
    "<tr><td>CPU</td><td class=\"num\">~" + ev.cpuObservedPct + "%</td><td class=\"num\">" + (tierOpt ? Math.round(tierOpt.projectedUtil * 100) + "%" : "n/a") + "</td><td class=\"num\">" + (tierOpt ? Math.round(tierOpt.projectedUtil * 100) + "% tier target" : "n/a") + "</td><td>" + (tierOpt ? riskBadge(tierOpt.projectedUtil > 0.70 ? "MEDIUM" : "LOW") : riskBadge(null)) + "</td></tr>" +
    "<tr><td>Memory (p01 free)</td><td class=\"num\">" + ev.currentFreeGib + " GiB</td><td class=\"num\">" + (tierOpt ? round1(tierOpt.memGib - (inst.current.memGib - ev.currentFreeGib)) + " GiB" : "n/a") + "</td><td class=\"num\">" + (tierOpt ? "floor ~" + round1(Math.max(1.5, tierOpt.memGib * 0.10)) + " GiB" : "n/a") + "</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Storage IOPS</td><td class=\"num\">" + ev.totalIops.toLocaleString() + "</td><td class=\"num\">" + Math.round((ev.totalIops / RDS_IOPS_BASELINE) * 100) + "% of baseline</td><td class=\"num\">" + RDS_IOPS_BASELINE.toLocaleString() + " baseline / " + RDS_IOPS_PEAK.toLocaleString() + " peak</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Storage throughput</td><td class=\"num\">" + ev.totalThroughputMibps + " MiB/s</td><td class=\"num\">" + Math.round((ev.totalThroughputMibps / RDS_MIBPS_BASELINE) * 100) + "% of baseline</td><td class=\"num\">" + RDS_MIBPS_BASELINE + " MiB/s baseline / " + RDS_MIBPS_PEAK + " MiB/s peak</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Network</td><td class=\"num\">" + netRxLabel + " Mbps in · " + netTxLabel + " Mbps out</td><td class=\"num\">≈0% of baseline</td><td class=\"num\">" + RDS_NET_BASELINE + " Mbps baseline / " + RDS_NET_PEAK + " Mbps peak</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Connections</td><td class=\"num\">" + ev.connections + "</td><td class=\"num\">no fabricated target</td><td class=\"num\">" + ev.connectionLimit.toLocaleString() + " configured limit</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "</tbody>";
  const scroll2 = el("div", "chart-scroll");
  scroll2.appendChild(table);
  card.appendChild(scroll2);
  card.appendChild(el("div", "chart-caption",
    "Observed over " + ev.cpuDays + " of the requested 60 days (" + Math.round(ev.cpuCoverage * 100) + "% sample coverage) — the requested horizon is never presented as the observed one. Latency (read " +
    ev.readLatencyMs + " ms / write " + ev.writeLatencyMs + " ms) and queue depth (" + ev.diskQueueDepth + ") are health context beneath storage capacity, not comparable percentages. The Network row's literal test-fixture values are near-zero placeholders (not realistic traffic) — shown as-is rather than replaced with a nicer-looking invented number."));
  return card;
}

function rdsBuildDbLoadPanel(inst) {
  const dl = inst.dbLoad;
  const card = el("div", "card dbload-panel");
  card.appendChild(el("div", "eyebrow", "What the database was waiting on"));
  if (dl.illustrative) card.appendChild(el("div", "illustrative-note", "Illustrative panel content (structure and copy follow rds_rightsizer_ui_spec.md §6; this exact scenario isn't asserted by a unit test)."));

  if (dl.state === "AVAILABLE") {
    card.appendChild(el("div", "decision-spec", "DB load measures active sessions running on CPU or waiting for a resource. A large non-CPU share can indicate I/O, locks, or query behavior that a larger instance alone may not fix."));
    const bar = el("div", "wait-bar");
    dl.shares.forEach((s) => {
      const seg = document.createElement("span");
      seg.style.width = Math.round(s.share * 100) + "%";
      seg.style.background = s.color;
      seg.textContent = Math.round(s.share * 100) + "%";
      bar.appendChild(seg);
    });
    card.appendChild(bar);
    const legend = el("div", "wait-legend");
    dl.shares.forEach((s) => { legend.appendChild(el("span", "wait-legend-item", '<span class="swatch" style="background:' + s.color + ';"></span>' + escapeHtml(s.name) + " " + Math.round(s.share * 100) + "%")); });
    card.appendChild(legend);
    card.appendChild(el("div", "decision-spec",
      "DB load p99 <span class=\"mono\">" + dl.dbLoadP99 + " AAS</span> (max <span class=\"mono\">" + dl.dbLoadMax + " AAS</span>) · CPU AAS p99 <span class=\"mono\">" + dl.cpuAasP99 + "</span> against <span class=\"mono\">" + dl.currentVcpus + " current vCPUs</span> · unattributed share " + Math.round(dl.unattributedShare * 100) + "% · observed " + dl.observedDays + " days."));
  } else if (dl.state === "DISABLED_REQUIRED") {
    const panel = el("div", "enable-panel");
    panel.innerHTML =
      '<div class="banner-title">Enable Database Insights for stronger confidence</div>' +
      '<div class="banner-body">The standard metrics are close or contradictory. Enable Database Insights Standard with Performance Insights, keep the default 7-day retention, and rescan so MaxOps can distinguish CPU work from I/O and lock waits.</div>' +
      '<div class="banner-body">Enabling Performance Insights doesn\'t require a reboot, failover, or database outage. MaxOps will not enable it automatically.</div>' +
      '<span class="doc-link">AWS documentation: Performance Insights →</span>';
    card.appendChild(panel);
  } else if (dl.state === "DISABLED_NOT_NEEDED") {
    card.appendChild(el("div", "quiet-status", "Database-load attribution wasn't required because standard CPU, memory, storage, network, and connection evidence all had ample headroom."));
  } else if (dl.state === "UNSUPPORTED") {
    card.appendChild(el("div", "quiet-status", "Performance Insights isn't supported for this engine/class. Manual review is required for borderline evidence — MaxOps doesn't show enablement instructions it can't act on."));
  } else if (dl.state === "ACCESS_DENIED") {
    card.appendChild(el("div", "quiet-status", "MaxOps is missing the pi:GetResourceMetrics permission for this account/region, so DB-load attribution couldn't run."));
  } else if (dl.state === "ERROR") {
    card.appendChild(el("div", "quiet-status", "A transient error prevented reading Performance Insights this scan. The conditional base recommendation is preserved."));
    const retry = el("button", "retry-btn", "Retry");
    retry.type = "button";
    card.appendChild(retry);
  }
  return card;
}

function rdsBuildTelemetryCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Telemetry disclosure"));
  const grid = el("div", "telemetry-grid");
  const labels = { cpu_percent: "CPU utilization", freeable_memory_bytes: "Freeable memory" };
  Object.keys(inst.telemetry || {}).forEach((k) => {
    const t = inst.telemetry[k];
    const absent = t.present === false;
    const cell = el("div", "telemetry-cell" + (absent ? " absent" : t.thin_data ? " thin" : ""));
    let body = '<div class="telemetry-metric">' + labels[k] + "</div>";
    if (absent) body += '<div class="telemetry-flag absent"><span class="dot"></span>Not present</div>';
    else {
      body += '<div class="telemetry-days">~' + t.observed_days + " days</div>";
      body += t.thin_data ? '<div class="telemetry-flag"><span class="dot"></span>Thin (' + Math.round(t.coverage_ratio * 100) + '% coverage)</div>' : '<div class="decision-spec">present, ' + Math.round(t.coverage_ratio * 100) + '% coverage</div>';
    }
    cell.innerHTML = body;
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  card.appendChild(el("div", "decision-spec", "Observed days uses the lesser of CPU/FreeableMemory coverage when both exist; requested 60 days is never presented as observed 60 days. No derived confidence score exists in the backend contract — this is disclosure, not a gate."));
  return card;
}

function rdsBuildCoverageCard(inst) {
  return buildCoverageDetails([
    ["Multi-AZ", inst.multiAz],
    ["Read replica", inst.readReplica],
    ["License model", inst.licenseModel, false],
    ["Pricing scope", "street_pricing_sqlite", false],
  ], "Class and storage recommendations are independent — they are never combined into one total or one apply path. Availability of the target class in this region/AZ is not validated by this recommendation.", inst.sourceTest);
}

function ecacheSelection(inst) {

  if (stored === "replica" && inst.replica) return "replica";
  if (stored && stored.indexOf("node:") === 0 && inst.tiers && inst.tiers[stored.slice(5)]) return stored;
  if (inst.tiers && inst.tiers.default && inst.tiers[inst.tiers.default]) return "node:" + inst.tiers.default;

}

  const selectedTierName = !selectedIsReplica && selection ? selection.slice(5) : null;
  const selectedTier = selectedTierName ? inst.tiers[selectedTierName] : null;
  const selectedClassification = selectedIsReplica ? inst.replica.classification : (selectedTier ? selectedTier.classification : inst.classification);

  if (selectedClassification === "CONDITIONAL") {
    root.appendChild(buildBanner("warning", "Review required before making a change",

  root.appendChild(ecacheBuildAlternativeSelector(inst, selection));
  if (selectedIsReplica) {
    root.appendChild(ecacheBuildReplicaCard(inst));

  if (inst.replica === null && inst.replicaDeferredReasonCodes) {
    root.appendChild(buildBanner("neutral", "Replica analysis unavailable",

  root.appendChild(ecacheBuildEvidenceCard(inst, selectedTier, selectedIsReplica));

  const activeRisk = selectedIsReplica ? (inst.replicaRisk || inst.risk) : inst.risk;

    activeRisk, activeReasons,
    "Overall = highest dimension. Storage is omitted entirely — ElastiCache has no storage decision lane, so it is never shown as a misleading LOW. Replica removal is a topology change: its migration risk is always at least MEDIUM."));

  const activeWarnings = selectedIsReplica

  return card;
}

function ecacheBuildAlternativeSelector(inst, selection) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Alternatives — pick one, never both"));
  card.appendChild(el("div", "decision-spec", "Alternatives are evaluated independently and are not combined. After making one change, run a new scan before considering the other."));

  // Node-type group
  card.appendChild(el("div", "tier-heading-note", "Change node type — Conservative / Balanced / Aggressive (no performance-change badge: ElastiCache has no CoreMark analogue)"));
  const grid = el("div", "tier-grid");
  ["conservative", "balanced", "aggressive"].forEach((name) => {
    const t = inst.tiers ? inst.tiers[name] : null;
    if (!t) {
      const u = el("div", "tier-card unavailable");
      const collapsedInto = inst.tiers && ["conservative", "balanced"].map((n) => inst.tiers[n]).find((o) => o && o.satisfiedTiers.includes(name));
      u.innerHTML = '<span class="tier-name">' + titleCase(name) + '</span><span class="tier-metric-value">' + (collapsedInto ? "Collapsed into " + escapeHtml(collapsedInto.targetNodeType) + " (same target)" : "No cost-saving option at this headroom") + "</span>";
      grid.appendChild(u);
      return;
    }
    const meta = classificationMeta(t.classification);
    const button = el("button", "tier-card");
    button.type = "button";
    if (selection === "node:" + name) button.classList.add("selected");
    if (name === inst.tiers.default) button.classList.add("default-tier");
    button.innerHTML =
      '<span class="tier-card-top"><span class="tier-name">' + titleCase(name) + (t.satisfiedTiers.length > 1 ? " · " + t.satisfiedTiers.filter((s) => s !== name).map(titleCase).join(" · ") : "") + (name === inst.tiers.default ? " — recommended" : "") + "</span>" + badgeHTML(meta.cls, meta.label) + "</span>" +
      '<span class="tier-target mono">' + escapeHtml(t.targetNodeType) + "</span>" +
      '<span class="decision-spec">' + t.vcpus + " vCPU / " + t.memGib + " GiB · " + fmtMoney(t.monthlyCost) + "/mo per node</span>" +
      '<span class="tier-savings">' + fmtMoney(t.monthlySavings) + "/mo savings per node</span>" +
      '<span class="tier-metrics">' +
        '<span><span class="tier-metric-label">Projected utilization</span><span class="tier-metric-value mono">' + (t.projectedUtil != null ? Math.round(t.projectedUtil * 100) + "%" : "n/a") + "</span></span>" +
        '<span><span class="tier-metric-label">Binding dimension</span><span class="tier-metric-value">Limited by ' + escapeHtml(t.bindingDimension || "n/a") + "</span></span>" +
      "</span>" +
      (t.reasonCodes.length ? '<span class="tier-caveat">' + escapeHtml(t.reasonCodes.join(", ")) + "</span>" : "");
    button.addEventListener("click", () => { ecacheSelectionByInstance[inst.id] = "node:" + name; renderEcacheDetail(); });
    grid.appendChild(button);
  });
  card.appendChild(grid);
  card.appendChild(el("div", "illustrative-note", "Tier split beyond \"Balanced target ∈ {cache.m6g.large, cache.m6g.xlarge}, default = balanced\" and the projected utilizations are illustrative; savings are exact test-catalog price deltas."));

  // Replica group
  card.appendChild(el("div", "tier-heading-note", "Reduce replicas — single option, no tiers"));
  if (inst.replica) {
    const r = inst.replica;
    const meta = classificationMeta(r.classification);
    const button = el("button", "tier-card");
    button.type = "button";
    button.style.maxWidth = "420px";
    if (selection === "replica") button.classList.add("selected");
    button.innerHTML =
      '<span class="tier-card-top"><span class="tier-name">Replica reduction</span>' + badgeHTML(meta.cls, meta.label) + "</span>" +
      '<span class="tier-target mono">' + r.currentReplicas + " → " + r.targetReplicas + " replicas per shard</span>" +
      '<span class="decision-spec">' + r.affectedNodeGroups + " shard affected · " + r.removedNodes + " node removed</span>" +
      '<span class="tier-savings">' + fmtMoney(r.monthlySavings) + "/mo savings</span>" +
      '<span class="tier-metrics"><span><span class="tier-metric-label">Projected busiest-survivor EngineCPU</span><span class="tier-metric-value mono">' + r.projectedSurvivorEngineCpu + "%</span></span></span>" +
      (r.reasonCodes.length ? '<span class="tier-caveat">' + escapeHtml(r.reasonCodes.join(", ")) + "</span>" : "");
    button.addEventListener("click", () => { ecacheSelectionByInstance[inst.id] = "replica"; renderEcacheDetail(); });
    card.appendChild(button);
  } else {
    card.appendChild(el("div", "empty-note", "No replica recommendation — " + escapeHtml((inst.replicaDeferredReasonCodes || ["not applicable"]).join(", ")) + "."));
  }
  return card;
}

function ecacheBuildReplicaCard(inst) {
  const r = inst.replica;
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Replica reduction — evidence"));
  if (r.classification === "ACTIONABLE") {
    card.appendChild(el("div", "headroom-sentence",
      "Every removed replica had <strong>zero observed reads</strong> — every observed five-minute GetTypeCmds Sum point is zero — and passed both coverage floors (coverage ≥ 95%, ≥ 30 observed days, latest sample ≤ 600 s old; each floor is inclusive)."));
  } else {
    card.appendChild(el("div", "headroom-sentence",
      "This reduction is <strong>CONDITIONAL</strong>: " + escapeHtml(r.reasonCodes.join(", ")) + ". See the per-replica evidence below for the exact failing value."));
  }
  if (inst.replicaPolicyNote) card.appendChild(el("div", "illustrative-note", inst.replicaPolicyNote));

  const table = el("table", "evidence-table");
  table.innerHTML =
    "<thead><tr><th>Member</th><th>Shard</th><th>Fate</th><th>p99 read ops/s</th><th>Max read ops/s</th><th>Total commands</th><th>Coverage</th><th>Observed days</th><th>Sample age</th></tr></thead>" +
    "<tbody>" + r.members.map((m) => {
      const fate = m.role === "primary" ? "primary — not removable" : m.removed ? "removed" : "retained";
      return "<tr><td class=\"mono\">" + escapeHtml(m.id) + "</td><td class=\"num\">" + escapeHtml(m.nodeGroup) + "</td><td>" + fate + "</td>" +
        "<td class=\"num\">" + m.readOpsP99 + "</td><td class=\"num\">" + m.readOpsMax + "</td><td class=\"num\">" + m.readOpsSum.toLocaleString() + "</td>" +
        "<td class=\"num\">" + Math.round(m.coverage * 100) + "%</td><td class=\"num\">" + m.observedDays + "</td><td class=\"num\">" + m.sampleAgeSeconds + " s</td></tr>";
    }).join("") + "</tbody>";
  const scroll = el("div", "chart-scroll");
  scroll.appendChild(table);
  card.appendChild(scroll);

  card.appendChild(el("div", "decision-spec",
    "Survivor projection: the removed replicas' read load is assumed to land entirely on the busiest survivor (worst-case concentration), giving a projected EngineCPU of " + r.projectedSurvivorEngineCpu + "% (limit 70%). Savings = " + r.removedNodes + " node × " + fmtMoney(ECACHE_UNIT_PRICE) + "/mo."));
  card.appendChild(el("div", "decision-spec",
    "Redundancy disclosure: reducing the replica count reduces read redundancy and failover headroom even when the safety floors hold — the floors preserve minimum posture, not current posture. Never below 1 replica with automatic failover/Multi-AZ; never to 0 replicas in V1."));
  return card;
}

function ecacheBuildEvidenceCard(inst, selectedTier, selectedIsReplica) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "15-month confidence trends"));
  const targetMode = !selectedIsReplica && !!selectedTier;
  if (targetMode) {
    const headroomX = round1(1 / selectedTier.projectedUtil);
    card.appendChild(el("div", "headroom-sentence",
      "Over the last 15 months on the hottest node, max EngineCPU was <strong class=\"mono\">" + inst.metrics.engineCpuMax + "%</strong> (p99 <strong class=\"mono\">" + inst.metrics.engineCpuP99 + "%</strong>). The selected <strong class=\"mono\">" + escapeHtml(selectedTier.targetNodeType) + "</strong> leaves ~<strong class=\"mono\">" + headroomX + "×</strong> headroom against the tier target."));
  } else {
    card.appendChild(el("div", "headroom-sentence",
      "Replica selection doesn't rescale CPU or memory trends — node type is unchanged. Raw trend context is shown below; the survivor projection is presented separately in the replica evidence card."));
  }

  const mkTrend = (label, seedSuffix, baseline, maxV, dw) => {
    const legend = el("div", "chart-legend");
    const suffix = dw ? " (on target)" : " (daily)";
    legend.innerHTML =
      '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);height:3px;"></span>Maximum' + suffix + '</span>' +
      '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);opacity:0.55;height:2px;"></span>p99' + suffix + '</span>' +
      '<span class="chart-legend-item"><span class="swatch dashedline"></span>p95' + suffix + '</span>';
    card.appendChild(legend);
    const scroll = el("div", "chart-scroll");
    const wrap = el("div", "chart-wrap");
    wrap.style.height = "260px";
    scroll.appendChild(wrap);
    card.appendChild(scroll);
    card.appendChild(el("div", "chart-caption", label));
    requestAnimationFrame(() => renderTrendChart(wrap, {
      profile: { seed: inst.id + seedSuffix, baseline: baseline, noiseAmp: baseline * 0.2, spikeChance: 0.02, spikeAmp: baseline * 0.4, min: Math.max(2, baseline * 0.4), max: maxV },
      dw, hasTarget: !!dw, metric: label,
    }));
  };
  const cpuDw = targetMode ? { headroomX: round1(1 / selectedTier.projectedUtil) } : null;
  mkTrend("EngineCPU — hottest series (" + inst.hottest.engineCpu + ", selection_reason: hottest_engine_cpu). Shard-primary context series are omitted in this mock; a real page discloses \"Showing N of M shard primaries\" when the backend truncates.", "-ecpu", inst.metrics.engineCpuP99, inst.metrics.engineCpuMax, cpuDw);
  mkTrend("Memory — hottest series (" + inst.hottest.memory + ", selection_reason: hottest_memory). Separate 0–100% plot — never a dual axis with CPU.", "-emem", inst.metrics.memoryP99, inst.metrics.memoryMax, cpuDw ? { headroomX: round1(1 / 0.60) } : null);
  card.appendChild(el("div", "illustrative-note", "Trend shapes are seeded synthetic series around the fixture's decision-scan p99/max; the fixture itself asserts only the decision-window aggregates."));
  return card;
}

function ecacheBuildDecisionWindowCard(inst, selectedTier, selectedIsReplica) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Decision window (last ~" + inst.observedDays + " observed days) vs. " + (selectedIsReplica ? "current node capacity (node type unchanged)" : "target capacity")));
  const m = inst.metrics;
  const list = el("div", "lane-list");

  const pctLane = (label, p99, maxV) => {
    const row = el("div", "lane");
    row.appendChild(el("div", "lane-label", label));
    const barRow = el("div", "lane-bar-row");
    const track = el("div", "lane-track");
    const cls = p99 < 40 ? "good" : p99 < 70 ? "warning" : "critical";
    track.innerHTML =
      '<div class="lane-fill ' + cls + '" style="width:' + clamp(p99, 2, 100) + '%"></div>' +
      '<div class="lane-marker" style="left:40%;"></div><div class="lane-marker-label" style="left:40%;">40%</div>' +
      '<div class="lane-marker" style="left:70%;"></div><div class="lane-marker-label" style="left:70%;">70%</div>';
    barRow.appendChild(track); row.appendChild(barRow);
    const val = el("div", "lane-value");
    val.innerHTML = '<span>p99 <span class="mono">' + p99 + "%</span> · max <span class=\"mono\">" + maxV + "%</span></span>";
    row.appendChild(val);
    list.appendChild(row);
  };
  pctLane("EngineCPU %", m.engineCpuP99, m.engineCpuMax);
  pctLane("Memory %", m.memoryP99, m.memoryMax);

  const net = inst.netTarget;
  [["Network in", m.netInP99, m.netInMax], ["Network out", m.netOutP99, m.netOutMax]].forEach(([label, p99, maxV]) => {
    const row = el("div", "lane");
    row.appendChild(el("div", "lane-label", label));
    const barRow = el("div", "lane-bar-row");
    const track = el("div", "lane-track");
    if (net.baseline != null) {
      const BL = 70;
      const peak = net.reliableMax != null ? net.reliableMax : net.baseline * 4;
      const posFor = (v) => v <= net.baseline ? (v / net.baseline) * BL : BL + Math.min((v - net.baseline) / (peak - net.baseline), 1) * (100 - BL);
      const overBaseline = p99 >= net.baseline;
      const cls = overBaseline ? "warning" : "good";
      const assumed = net.kind === "ASSUMED_BASELINE";
      track.innerHTML =
        '<div class="lane-burst-zone" style="left:' + BL + '%;right:0;"></div>' +
        '<div class="lane-fill ' + cls + '" style="width:' + clamp(posFor(p99), 1.5, 100).toFixed(1) + '%"></div>' +
        '<div class="lane-baseline-line' + (assumed ? ' assumed' : '') + '" style="left:' + BL + '%"></div>' +
        '<div class="lane-marker-label" style="left:' + BL + '%">baseline' + (assumed ? " (est.)" : "") + '</div>' +
        '<div class="lane-max-tick" style="left:' + clamp(posFor(maxV), 1.5, 100).toFixed(1) + '%"></div>';
      barRow.appendChild(track); row.appendChild(barRow);
      const val = el("div", "lane-value");
      val.innerHTML = '<span>p99 <span class="mono">' + p99 + ' Mbps</span> · max <span class="mono">' + maxV + ' Mbps</span></span><span class="mono">' + Math.round((p99 / net.baseline) * 100) + "% of " + (assumed ? "assumed " : "") + "baseline (" + net.baseline + " Mbps)</span>";
      row.appendChild(val);
    } else {
      track.innerHTML = '<div class="lane-fill approx" style="width:38%"></div><span style="position:absolute;left:8px;top:1px;font-size:0.6875rem;font-weight:700;color:var(--ink-secondary);">≈ capacity approximate</span>';
      barRow.appendChild(track); row.appendChild(barRow);
      const val = el("div", "lane-value");
      val.innerHTML = '<span>p99 <span class="mono">' + p99 + ' Mbps</span></span><span class="approx-note">target: ' + escapeHtml(net.label || "unknown capacity") + "</span>";
      row.appendChild(val);
    }
    list.appendChild(row);
  });
  card.appendChild(list);
  card.appendChild(el("div", "decision-spec",
    selectedIsReplica
      ? "Lanes show observed demand against the current node type — replica removal changes topology, not per-node capacity."
      : "Network lanes use the EC2 baseline/burst visual language; a dashed baseline is an exact-family assumed estimate, never authoritative. No ratio is fabricated when target capacity is unknown."));
  return card;
}

function ecacheBuildCacheHealthCard(inst) {
  const m = inst.metrics;
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Cache health"));
  const table = el("table", "evidence-table");
  const lag = m.lagP99 != null ? m.lagP99 + " s p99 / " + m.lagMax + " s max" : "not collected";
  table.innerHTML =
    "<thead><tr><th>Signal</th><th>Observed</th><th>Status</th></tr></thead><tbody>" +
    "<tr><td>Evictions</td><td class=\"num\">" + m.evictions + "</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Swap usage</td><td class=\"num\">" + m.swapBytes + " bytes</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "<tr><td>Replication lag</td><td class=\"num\">" + lag + "</td><td>" + (m.lagP99 != null ? riskBadge("LOW") : riskBadge(null)) + "</td></tr>" +
    "<tr><td>Traffic management</td><td class=\"num\">never active in window</td><td>" + riskBadge("LOW") + "</td></tr>" +
    "</tbody>";
  const scroll = el("div", "chart-scroll");
  scroll.appendChild(table);
  card.appendChild(scroll);
  if (m.lagP99 == null) {
    card.appendChild(el("div", "decision-spec", "Missing ReplicationLag renders as \"not collected\" with an n/a status — never as zero lag."));
  }
  return card;
}

function ecacheBuildTelemetryCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Telemetry disclosure"));
  const grid = el("div", "telemetry-grid");
  [["EngineCPU", inst.observedDays], ["Memory", inst.observedDays], ["Network in/out", inst.observedDays]].forEach(([label, days]) => {
    const thin = days < 7;
    const cell = el("div", "telemetry-cell" + (thin ? " thin" : ""));
    cell.innerHTML = '<div class="telemetry-metric">' + label + '</div><div class="telemetry-days">~' + days + " days</div>" +
      (thin ? '<div class="telemetry-flag"><span class="dot"></span>Under 7 days — visibly thin</div>' : '<div class="decision-spec">present, considered in full</div>');
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  card.appendChild(el("div", "decision-spec",
    "ElastiCache never returns INSUFFICIENT_DATA — thin telemetry is disclosed via observed_days and does not change node-type classification. Replica removal is the one narrower exception: insufficient read coverage/history prevents ACTIONABLE because observed zeroes can't prove an unused replica across an inadequately observed window."));
  return card;
}

function ecacheBuildCoverageCard(inst) {
  const cc = inst.constraintCoverage || {};
  return buildCoverageDetails([
    ["Network baseline assumed", !!cc.networkBaselineAssumed],
    ["Auto Scaling attachment verified", true],
    ["Assumed network baseline (Mbps)", cc.assumedNetworkBaselineMbps != null ? cc.assumedNetworkBaselineMbps : "n/a", false],
    ["Availability validated", "false — advisory only", false],
  ], "No savings previews exist for this product, and the rightsizer is read-only in V1 — runbook actions are separate and are never preselected by choosing an alternative here.", inst.sourceTest);
}

/* =======================================================================
   Theme toggle + tab switching + init
======================================================================= */
let themeMode = "system";
function applyTheme() {
  if (themeMode === "light" || themeMode === "dark") document.documentElement.setAttribute("data-theme", themeMode);
  else document.documentElement.removeAttribute("data-theme");
  const btn = document.getElementById("themeToggle");
  btn.textContent = "Theme: " + titleCase(themeMode);
}
document.getElementById("themeToggle").addEventListener("click", () => {
  themeMode = themeMode === "system" ? "light" : themeMode === "light" ? "dark" : "system";
  applyTheme();
});
applyTheme();

const TABS = [
  { btn: "tabBtnEc2", panel: "panel-ec2" },
  { btn: "tabBtnAsg", panel: "panel-asg" },
  { btn: "tabBtnRds", panel: "panel-rds" },
  { btn: "tabBtnEcache", panel: "panel-ecache" },
];
function selectTab(panelId) {
  TABS.forEach((t) => {
    const isActive = t.panel === panelId;
    document.getElementById(t.btn).setAttribute("aria-selected", String(isActive));
    document.getElementById(t.panel).hidden = !isActive;
  });
}
TABS.forEach((t) => document.getElementById(t.btn).addEventListener("click", () => selectTab(t.panel)));
