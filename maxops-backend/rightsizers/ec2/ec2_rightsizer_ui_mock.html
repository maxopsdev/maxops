<title>EC2 Rightsizer — Evidence &amp; Recommendations</title>
<style>
  :root {
    --page-bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-raised: #f2f2ef;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --accent: #2a78d6;
    --accent-tint: rgba(42,120,214,0.10);
    --accent-tint-strong: rgba(42,120,214,0.22);
    --good: #0ca30c;
    --good-tint: rgba(12,163,12,0.12);
    --warning: #fab219;
    --warning-tint: rgba(250,178,25,0.16);
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-tint: rgba(208,59,59,0.12);
    --info: #4a3aa7;
    --info-tint: rgba(74,58,167,0.10);
    --neutral: #898781;
    --neutral-tint: rgba(137,135,129,0.14);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-raised: #232322;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --accent: #3987e5;
      --accent-tint: rgba(57,135,229,0.14);
      --accent-tint-strong: rgba(57,135,229,0.28);
      --good: #0ca30c;
      --good-tint: rgba(12,163,12,0.18);
      --warning: #fab219;
      --warning-tint: rgba(250,178,25,0.18);
      --serious: #ec835a;
      --critical: #e66767;
      --critical-tint: rgba(230,103,103,0.18);
      --info: #9085e9;
      --info-tint: rgba(144,133,233,0.16);
      --neutral: #898781;
      --neutral-tint: rgba(137,135,129,0.18);
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0d0d0d; --surface: #1a1a19; --surface-raised: #232322;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --ink-primary: #ffffff; --ink-secondary: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835;
    --accent: #3987e5; --accent-tint: rgba(57,135,229,0.14); --accent-tint-strong: rgba(57,135,229,0.28);
    --good: #0ca30c; --good-tint: rgba(12,163,12,0.18);
    --warning: #fab219; --warning-tint: rgba(250,178,25,0.18);
    --serious: #ec835a; --critical: #e66767; --critical-tint: rgba(230,103,103,0.18);
    --info: #9085e9; --info-tint: rgba(144,133,233,0.16);
    --neutral: #898781; --neutral-tint: rgba(137,135,129,0.18);
  }
  :root[data-theme="light"] {
    --page-bg: #f9f9f7; --surface: #fcfcfb; --surface-raised: #f2f2ef;
    --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.16);
    --ink-primary: #0b0b0b; --ink-secondary: #52514e; --ink-muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7;
    --accent: #2a78d6; --accent-tint: rgba(42,120,214,0.10); --accent-tint-strong: rgba(42,120,214,0.22);
    --good: #0ca30c; --good-tint: rgba(12,163,12,0.12);
    --warning: #fab219; --warning-tint: rgba(250,178,25,0.16);
    --serious: #ec835a; --critical: #d03b3b; --critical-tint: rgba(208,59,59,0.12);
    --info: #4a3aa7; --info-tint: rgba(74,58,167,0.10);
    --neutral: #898781; --neutral-tint: rgba(137,135,129,0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .topbar h1 { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.01em; }
  .topbar .tagline { color: var(--ink-secondary); font-size: 0.8125rem; }
  .topbar .disclaimer {
    margin-left: auto; color: var(--ink-muted); font-size: 0.75rem; max-width: 46ch;
    text-align: right;
  }

  .layout { display: flex; flex: 1; min-height: 0; }

  /* ---------- rail ---------- */
  .rail {
    width: 320px; flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .rail-eyebrow {
    padding: 16px 20px 8px; font-size: 0.6875rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);
  }
  .rail-group {
    padding: 12px 20px 7px; border-bottom: 1px solid var(--border);
    background: var(--surface-raised); color: var(--ink-secondary);
    font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rail-item {
    width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px;
    padding: 13px 20px; border: none; border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent; background: transparent; cursor: pointer;
    color: inherit;
  }
  .rail-item:hover { background: var(--surface-raised); }
  .rail-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rail-item[aria-current="true"] {
    background: var(--accent-tint); border-left-color: var(--accent);
  }
  .rail-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-item-name { font-weight: 600; font-size: 0.9375rem; }
  .rail-item-meta { font-size: 0.75rem; color: var(--ink-muted); }
  .rail-item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-item-savings { font-size: 0.8125rem; font-weight: 600; }
  .rail-item-savings.positive { color: var(--good); }

  /* ---------- detail ---------- */
  .detail { flex: 1; overflow-y: auto; }
  .detail-inner { max-width: 980px; margin: 0 auto; padding: 28px 32px 96px; display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 26px; display: flex; flex-direction: column; gap: 14px;
  }
  .eyebrow {
    font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-muted);
  }

  /* ---------- badges / chips ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 9px;
    border-radius: 999px; font-size: 0.8125rem; font-weight: 700; white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .badge-good { background: var(--good-tint); color: var(--ink-primary); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .badge-good .dot { background: var(--good); }
  .badge-warning { background: var(--warning-tint); color: var(--ink-primary); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
  .badge-warning .dot { background: var(--warning); }
  .badge-critical { background: var(--critical-tint); color: var(--ink-primary); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
  .badge-critical .dot { background: var(--critical); }
  .badge-info { background: var(--info-tint); color: var(--ink-primary); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
  .badge-info .dot { background: var(--info); }
  .badge-neutral { background: var(--neutral-tint); color: var(--ink-primary); border-color: color-mix(in srgb, var(--neutral) 40%, transparent); }
  .badge-neutral .dot { background: var(--neutral); }

  .tag {
    display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 6px;
    font-size: 0.6875rem; font-weight: 600; background: var(--surface-raised);
    color: var(--ink-secondary); border: 1px solid var(--border);
  }

  /* ---------- decision header ---------- */
  .decision-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .decision-id { color: var(--ink-muted); font-size: 0.8125rem; margin-top: 2px; }
  .decision-id .mono { color: var(--ink-secondary); }
  .decision-types { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 1.0625rem; }
  .decision-types .mono { font-weight: 700; }
  .decision-types .arrow { color: var(--ink-muted); font-size: 0.9em; }
  .decision-spec { color: var(--ink-muted); font-size: 0.75rem; margin-top: 2px; }
  .savings-block { text-align: right; }
  .savings-figure { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .savings-figure.positive { color: var(--good); }
  .savings-sub { color: var(--ink-secondary); font-size: 0.8125rem; margin-top: 6px; }
  .savings-reason { max-width: 30ch; color: var(--ink-secondary); font-size: 0.875rem; }

  /* ---------- recommendation tiers ---------- */
  .tier-section { display: flex; flex-direction: column; gap: 10px; }
  .tier-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .tier-heading-note { color: var(--ink-muted); font-size: 0.75rem; }
  .tier-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 820px) { .tier-grid { grid-template-columns: 1fr; } }
  .tier-card {
    min-width: 0; padding: 15px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: inherit; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 9px;
  }
  .tier-card:hover { border-color: var(--border-strong); background: var(--surface-raised); }
  .tier-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tier-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint-strong); }
  .tier-card.default-tier { background: var(--accent-tint); }
  .tier-card.unavailable { cursor: default; opacity: 0.65; background: var(--surface-raised); }
  .tier-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tier-name { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .tier-target { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; }
  .tier-savings { color: var(--good); font-weight: 700; }
  .tier-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; }
  .tier-metric-label { display: block; color: var(--ink-muted); font-size: 0.6875rem; }
  .tier-metric-value { display: block; font-size: 0.8125rem; font-weight: 600; }
  .tier-performance-gain {
    align-self: flex-start; padding: 4px 8px; border-radius: 999px;
    background: var(--good-tint); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent);
    color: var(--ink-primary); font-size: 0.75rem; font-weight: 700;
  }
  .tier-caveat { color: var(--ink-muted); font-size: 0.6875rem; line-height: 1.4; }

  /* ---------- banners ---------- */
  .banner {
    display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px;
    border-radius: 10px; font-size: 0.875rem; border: 1px solid transparent;
  }
  .banner-icon { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; }
  .banner-warning { background: var(--warning-tint); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
  .banner-neutral { background: var(--neutral-tint); border-color: color-mix(in srgb, var(--neutral) 40%, transparent); }
  .banner-title { font-weight: 700; margin-bottom: 2px; }
  .banner-body { color: var(--ink-secondary); }

  /* ---------- headroom sentence ---------- */
  .headroom-sentence { font-size: 0.9375rem; line-height: 1.6; }
  .headroom-sentence strong { font-weight: 700; }
  .headroom-sentence .mono { font-weight: 700; }

  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .checklist li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.875rem; color: var(--ink-secondary); }
  .checklist li::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted);
    margin-top: 7px; flex-shrink: 0;
  }

  /* ---------- risk grid ---------- */
  .risk-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px;
  }
  @media (max-width: 700px) { .risk-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .risk-cell {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px; background: var(--surface-raised);
  }
  .risk-cell.overall { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .risk-cell-label { font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; }
  .reason-codes { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- charts ---------- */
  .chart-scroll { overflow-x: auto; }
  .chart-wrap { position: relative; min-width: 640px; }
  .chart-caption { color: var(--ink-muted); font-size: 0.75rem; margin-top: 6px; }
  svg.chart-svg { display: block; width: 100%; height: auto; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.8125rem; color: var(--ink-secondary); }
  .chart-legend-item { display: flex; align-items: center; gap: 7px; }
  .chart-legend-item .swatch { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .chart-legend-item .swatch.dashedline { background: none; border-top: 2px dashed var(--ink-muted); height: 0; }

  .tooltip {
    position: absolute; pointer-events: none; z-index: 5; background: var(--ink-primary);
    color: var(--page-bg); border-radius: 8px; padding: 8px 11px; font-size: 0.75rem;
    line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,0.18); opacity: 0; transition: opacity 0.08s;
    white-space: nowrap;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .t-date { color: color-mix(in srgb, var(--page-bg) 65%, transparent); margin-bottom: 3px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  .tooltip .t-row .t-val { font-weight: 700; font-family: var(--font-mono); }

  /* ---------- bucket small multiples ---------- */
  .bucket-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; }
  @media (max-width: 820px) { .bucket-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (max-width: 480px) { .bucket-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .bucket-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 12px 13px;
    display: flex; flex-direction: column; gap: 5px; min-width: 0;
  }
  .bucket-label { font-size: 0.6875rem; color: var(--ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .bucket-max { font-family: var(--font-mono); font-weight: 700; font-size: 1.25rem; }
  .bucket-meter { height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden; }
  .bucket-meter > span { display: block; height: 100%; background: var(--accent); opacity: 0.55; border-radius: 2px; }
  .bucket-percentiles { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--ink-secondary); }
  .bucket-percentiles.na { color: var(--ink-muted); font-family: var(--font-sans); font-style: italic; }
  .bucket-empty { color: var(--ink-muted); font-size: 0.6875rem; font-style: italic; margin-top: 2px; }
  .bucket-footnote { color: var(--ink-muted); font-size: 0.75rem; margin-top: 2px; }

  /* ---------- decision-window bars ---------- */
  .lane-list { display: flex; flex-direction: column; gap: 14px; }
  .lane { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
  @media (max-width: 620px) { .lane { grid-template-columns: 1fr; } }
  .lane-label { font-size: 0.8125rem; font-weight: 600; color: var(--ink-secondary); }
  .lane-bar-row { position: relative; }
  .lane-track {
    position: relative; height: 18px; border-radius: 4px; background: var(--surface-raised);
    border: 1px solid var(--border); overflow: visible;
  }
  .lane-fill {
    position: absolute; top: 0; left: 0; bottom: 0; border-radius: 4px 0 0 4px;
    min-width: 3%;
  }
  .lane-fill.good { background: var(--good); }
  .lane-fill.warning { background: var(--warning); }
  .lane-fill.critical { background: var(--critical); }
  .lane-fill.approx {
    background: repeating-linear-gradient(135deg, var(--neutral) 0 3px, transparent 3px 7px);
    opacity: 0.55; border: 1px dashed var(--border-strong);
  }
  .lane-marker {
    position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-muted);
  }
  .lane-marker-label {
    position: absolute; top: -17px; font-size: 0.625rem; color: var(--ink-muted);
    transform: translateX(-50%); white-space: nowrap;
  }
  .lane-value {
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-secondary);
    margin-top: 5px; display: flex; justify-content: space-between; gap: 8px;
  }
  .lane-value .approx-note { font-family: var(--font-sans); font-style: italic; color: var(--ink-muted); }
  /* baseline-anchored network burst-zone bar (spec §5.3) */
  .lane-burst-zone { position: absolute; top: 0; bottom: 0; background: var(--warning); opacity: 0.16; }
  .lane-baseline-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-secondary); }
  .lane-baseline-line.assumed { width: 0; background: none; border-left: 2px dashed var(--ink-secondary); }
  .lane-peak-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--critical); opacity: 0.65; }
  .lane-max-tick { position: absolute; top: -4px; width: 2px; height: 26px; background: var(--ink-primary); opacity: 0.8; }
  .mem-empty { color: var(--ink-muted); font-style: italic; padding: 26px 16px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; background: var(--surface-raised); }

  /* ---------- warnings ---------- */
  .warning-list { display: flex; flex-direction: column; gap: 12px; }
  .warning-item {
    border: 1px solid var(--border); border-left: 3px solid var(--warning);
    border-radius: 0 8px 8px 0; padding: 10px 14px; background: var(--surface-raised);
  }
  .warning-code { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--ink-muted); margin-bottom: 4px; }
  .warning-message { font-size: 0.875rem; color: var(--ink-secondary); }
  .empty-note { color: var(--ink-muted); font-size: 0.875rem; font-style: italic; }

  /* ---------- telemetry disclosure ---------- */
  .telemetry-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  @media (max-width: 700px) { .telemetry-grid { grid-template-columns: 1fr; } }
  .telemetry-cell {
    border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .telemetry-cell.thin { border-color: color-mix(in srgb, var(--warning) 55%, transparent); background: var(--warning-tint); }
  .telemetry-metric { font-size: 0.8125rem; font-weight: 600; }
  .telemetry-days { font-family: var(--font-mono); font-size: 1.0625rem; font-weight: 700; }
  .telemetry-flag { font-size: 0.75rem; color: var(--ink-primary); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .telemetry-flag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex-shrink: 0; }

  /* ---------- coverage (collapsible) ---------- */
  details.card { padding: 0; }
  details.card > summary {
    list-style: none; cursor: pointer; padding: 22px 26px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary .chev { transition: transform 0.15s; color: var(--ink-muted); }
  details.card[open] > summary .chev { transform: rotate(90deg); }
  .coverage-body { padding: 0 26px 22px; display: flex; flex-direction: column; gap: 14px; }
  .coverage-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 22px; }
  @media (max-width: 620px) { .coverage-grid { grid-template-columns: 1fr; } }
  .coverage-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.8125rem; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .coverage-row .k { color: var(--ink-secondary); }
  .coverage-row .v { font-weight: 600; }
  .coverage-row .v.yes { color: var(--good); }
  .coverage-row .v.no { color: var(--ink-muted); }

  /* ---------- footer note ---------- */
  .foot-note { color: var(--ink-muted); font-size: 0.75rem; text-align: center; padding: 8px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }

/* ---------------------------------------------------------------------
   Seeded PRNG — mulberry32. Trend shape must be stable across reloads,
   so no bare Math.random() drives series generation.
--------------------------------------------------------------------- */
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* ---------------------------------------------------------------------
   Daily CPU series generator. Produces { dayIndex, maximum, p99, p95 }
   for TOTAL_DAYS, oldest -> newest. `profile` describes the workload
   shape in the same terms as the dummy-data spec's cpu_trend_profile.
--------------------------------------------------------------------- */
const TOTAL_DAYS = 455;

function generateDailySeries(profile) {
  const rand = mulberry32(hashSeed(profile.seed));
  const days = profile.daysAvailable ?? TOTAL_DAYS;
  const offset = TOTAL_DAYS - days; // leading days (older than history) are null
  const points = new Array(TOTAL_DAYS).fill(null);
  for (let i = offset; i < TOTAL_DAYS; i++) {
    let base = profile.baseline;
    if (profile.weekly) {
      const dow = i % 7;
      base = (dow === 0 || dow === 6) ? profile.weekendBaseline : profile.weekdayBaseline;
    }
    let val = base + (rand() * 2 - 1) * profile.noiseAmp;
    if (profile.periodicSpike && (i % profile.periodicSpike.every) < profile.periodicSpike.width) {
      val += profile.periodicSpike.amp * (0.5 + rand() * 0.5);
    }
    if (rand() < profile.spikeChance) {
      val += profile.spikeAmp * (0.4 + rand() * 0.6);
    }
    val = clamp(val, profile.min ?? 1, profile.max ?? 99);
    const p99 = clamp(val * (0.55 + rand() * 0.2), 0, val);
    const p95 = clamp(p99 * (0.72 + rand() * 0.15), 0, p99);
    points[i] = { dayIndex: i, maximum: round1(val), p99: round1(p99), p95: round1(p95) };
  }
  return points;
}
function round1(v) { return Math.round(v * 10) / 10; }

function cloneMock(value) {
  if (value === undefined || value === null) return value;
  return JSON.parse(JSON.stringify(value));
}

function catalogFacts(instanceType) {
  const row = MOCK_CATALOG[instanceType];
  if (!row) return null;
  return {
    vcpus: row[0], memoryGiB: row[1], architecture: row[2], monthlyUsd: row[3],
    networkBaselineMbps: row[4], networkReliableMaxMbps: row[5],
    ebsBaselineIops: row[6], ebsBaselineThroughputMibps: row[7],
    instanceStoreDeviceCount: row[8], sourceRegion: "us-east-1",
  };
}

function attachCatalogFacts(instance) {
  const current = catalogFacts(instance.currentType);
  const target = instance.targetType ? catalogFacts(instance.targetType) : null;
  if (!current || (instance.targetType && !target)) {
    throw new Error("Missing mock catalog entry for " + (current ? instance.targetType : instance.currentType));
  }
  instance.catalog = { current, target };
  if (!instance.currentSpec || !instance.currentSpec.includes("instance store")) {
    instance.currentSpec = current.vcpus + " vCPU / " + current.memoryGiB + " GiB";
  }
  if (target) {
    const prefix = target.architecture === "arm64" ? "Graviton · " : "";
    instance.targetSpec = prefix + target.vcpus + " vCPU / " + target.memoryGiB + " GiB";
    if (instance.catalogMode === "REAL_CATALOG") {
      instance.monthlySavings = round1(current.monthlyUsd - target.monthlyUsd);
      instance.yearlySavings = round1(instance.monthlySavings * 12);
      instance.savingsPercent = Math.round(instance.monthlySavings / current.monthlyUsd * 100);
    }
  }
  return instance;
}

const BASE_INSTANCE_BY_ID = new Map(BASE_INSTANCES.map((instance) => [instance.id, instance]));
const INSTANCES = INSTANCE_GROUPS.flatMap((group) => {
  const template = BASE_INSTANCE_BY_ID.get(group.templateId);
  if (!template) throw new Error("Missing mock template: " + group.templateId);
  const base = {
    ...cloneMock(template),
    groupId: group.id,
    groupLabel: group.label,
    catalogMode: group.templateCatalogMode,
  };
  const variants = group.variants.map((overrides, index) => attachCatalogFacts({
    ...cloneMock(template),
    ...overrides,
    groupId: group.id,
    groupLabel: group.label,
    catalogMode: group.variantCatalogMode || "REAL_CATALOG",
    tiers: null,
    profile: { ...cloneMock(template.profile), seed: overrides.id + "-cpu" },
    memory: template.memory && template.memory.present
      ? { ...cloneMock(template.memory), profile: { ...cloneMock(template.memory.profile), seed: overrides.id + "-memory" } }
      : cloneMock(template.memory),
    mockVariant: index + 1,
  }));
  return [attachCatalogFacts(base), ...variants];
});

const RISK_META = {
  LOW: { cls: "good", label: "Low" },
  MEDIUM: { cls: "warning", label: "Medium" },
  HIGH: { cls: "critical", label: "High" },
  BLOCKED: { cls: "critical", label: "Blocked" },
};
function riskBadge(level, extraClass) {
  const meta = RISK_META[level] || { cls: "neutral", label: "n/a" };
  return badgeHTML(meta.cls, meta.label, extraClass);
}
function badgeHTML(cls, label, extraClass) {
  return '<span class="badge badge-' + cls + (extraClass ? " " + extraClass : "") + '"><span class="dot"></span>' + escapeHtml(label) + "</span>";
}

const CLASSIFICATION_META = {
  ACTIONABLE: { cls: "good", label: "Actionable" },
  CONDITIONAL: { cls: "warning", label: "Conditional — review required" },
  OPPORTUNITY: { cls: "info", label: "Opportunity — migration" },
  DEFERRED: { cls: "neutral", label: "Deferred" },
  INSUFFICIENT_DATA: { cls: "warning", label: "Insufficient data" },
  REJECTED: { cls: "critical", label: "Rejected" },
};

const REASON_LABELS = {
  MANAGED_BY_ASG: "Managed by an Auto Scaling group — resize via the launch template, not per-instance.",
  MANAGED_BY_ECS: "Managed by an ECS cluster — resize via the task/service definition.",
  MANAGED_BY_KUBERNETES: "Managed by a Kubernetes/EKS node group — resize via the node group config.",
  UNSUPPORTED_TENANCY: "Non-default tenancy is out of scope for standalone resizing in V1.",
  UNSUPPORTED_LIFECYCLE: "Spot or scheduled lifecycle is out of scope for standalone resizing in V1.",
  INSTANCE_STORE_USAGE_UNKNOWN: "Local instance-store use can’t be proven absent from inventory alone.",
};

const TIER_ORDER = ["conservative", "balanced", "aggressive"];
let selectedId = INSTANCES[0].id;
const selectedTierByInstance = {};

function titleCase(value) {
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function selectedTierName(inst) {
  if (!inst.tiers) return null;
  const preferred = selectedTierByInstance[inst.id] || inst.tiers.default;
  if (preferred && inst.tiers[preferred]) return preferred;
  return TIER_ORDER.find((name) => inst.tiers[name]) || null;
}

function selectedInstanceView(inst) {
  const tierName = selectedTierName(inst);
  const option = tierName && inst.tiers ? inst.tiers[tierName] : null;
  return option ? { ...inst, ...option, selectedTier: tierName } : inst;
}

--------------------------------------------------------------------- */
function renderRail() {
  const rail = document.getElementById("rail");
  const eyebrow = rail.querySelector(".rail-eyebrow");
  rail.innerHTML = "";
  eyebrow.textContent = INSTANCES.length + " instances evaluated · " + INSTANCE_GROUPS.length + " behavior groups";
  rail.appendChild(eyebrow);
  INSTANCE_GROUPS.forEach((group) => {
    rail.appendChild(el("div", "rail-group", group.label));
    INSTANCES.filter((instance) => instance.groupId === group.id).forEach((inst) => {
      const meta = CLASSIFICATION_META[inst.classification];
      const btn = document.createElement("button");
      btn.className = "rail-item";
      btn.type = "button";
      btn.setAttribute("aria-current", String(inst.id === selectedId));
      const savingsHtml = inst.classification === "DEFERRED"
        ? '<span class="rail-item-meta">' + escapeHtml((inst.deferredReasonCodes || [])[0] || "") + "</span>"
        : '<span class="rail-item-savings positive">$' + Math.round(inst.monthlySavings) + "/mo</span>";
      btn.innerHTML =
        '<span class="rail-item-top"><span class="rail-item-name">' + escapeHtml(inst.id) + '</span><span class="rail-item-meta mono">' + escapeHtml(inst.resourceId) + '</span></span>' +
        '<span class="rail-item-meta mono">' + escapeHtml(inst.currentType) + " · " + escapeHtml(inst.region) + '</span>' +
        '<span class="rail-item-bottom">' + badgeHTML(meta.cls, meta.label) + savingsHtml + "</span>";
      btn.addEventListener("click", () => selectInstance(inst.id));
      rail.appendChild(btn);
    });
  });
}

function selectInstance(id) {
  selectedId = id;
  renderRail();
  renderDetail();
  document.getElementById("detail").scrollTop = 0;
}

/* ---------------------------------------------------------------------
   Detail pane
--------------------------------------------------------------------- */
function renderDetail() {
  const baseInstance = INSTANCES.find((i) => i.id === selectedId);
  const inst = selectedInstanceView(baseInstance);
  const root = document.getElementById("detailInner");
  root.innerHTML = "";

  root.appendChild(buildDecisionHeader(inst));
  const tierSelector = buildTierSelector(baseInstance);
  if (tierSelector) root.appendChild(tierSelector);

  if (inst.classification === "CONDITIONAL" && inst.requiredReview) {
    root.appendChild(buildBanner("warning", "Review required before applying",
      "This recommendation is CONDITIONAL. Read the summary and warnings below before resizing."));
  }
  if (inst.telemetry && Object.values(inst.telemetry).some((t) => t.thin_data)) {
    root.appendChild(buildBanner("warning", "Limited telemetry",
      "Fewer than 7 days of data are available for one or more metrics. The recommendation is shown for transparency — you decide whether it’s enough."));
  }
  if (inst.classification === "DEFERRED") {
    root.appendChild(buildBanner("neutral", "No standalone recommendation",
      inst.deferredNote || REASON_LABELS[(inst.deferredReasonCodes || [])[0]] || "This instance is out of scope for standalone resizing."));
  }

  root.appendChild(buildWhyCard(inst));
  root.appendChild(buildMemoryChart(inst));
  root.appendChild(buildWarningsCard(inst));
  if (inst.risk) root.appendChild(buildRiskCard(inst));
  root.appendChild(buildBucketCard(inst));
  if (inst.classification !== "DEFERRED") root.appendChild(buildDecisionWindowCard(inst));
  root.appendChild(buildTelemetryCard(inst));
  root.appendChild(buildCoverageCard(inst));

  const foot = document.createElement("p");
  foot.className = "foot-note";
  foot.textContent = "Mock data for UI review — not a live AWS account.";
  root.appendChild(foot);
}

function el(tag, className, html) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtMoney(v) { return "$" + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtPerformanceChange(v) {
  const rounded = Math.round(v);
  return "~" + (rounded > 0 ? "+" : "") + rounded + "%";
}

/* ---- 4.1a recommendation tiers ---- */
function buildTierSelector(inst) {
  if (!inst.tiers) return null;
  const available = TIER_ORDER
    .map((name) => ({ name, option: inst.tiers[name] }))
    .filter((entry) => entry.option);
  const distinctTargets = new Set(available.map((entry) => entry.option.targetType));
  if (distinctTargets.size <= 1) return null;

  const groups = [];
  const byTarget = new Map();
  available.forEach(({ name, option }) => {
    let group = byTarget.get(option.targetType);
    if (!group) {
      group = { names: [], option };
      byTarget.set(option.targetType, group);
      groups.push(group);
    }
    group.names.push(name);
  });

  const section = el("section", "tier-section");
  const heading = el("div", "tier-heading");
  heading.innerHTML = '<div class="eyebrow">Recommendation options</div>' +
    '<div class="tier-heading-note">Choose savings vs. headroom · Balanced is recommended</div>';
  section.appendChild(heading);
  const grid = el("div", "tier-grid");
  const activeTier = selectedTierName(inst);

  groups.forEach((group) => {
    const option = group.option;
    const tierName = group.names.includes(inst.tiers.default)
      ? inst.tiers.default
      : group.names[0];
    const meta = CLASSIFICATION_META[option.classification];
    const button = el("button", "tier-card");
    button.type = "button";
    if (group.names.includes(activeTier)) button.classList.add("selected");
    if (group.names.includes(inst.tiers.default)) button.classList.add("default-tier");
    const labels = group.names.map(titleCase).join(" · ");
    const performanceGain = option.performanceChangePct > 0
      ? '<span class="tier-performance-gain">' + fmtPerformanceChange(option.performanceChangePct) + " CPU performance</span>"
      : "";
    const performanceCaveat = option.performanceChangePct > 0
      ? '<span class="tier-caveat">Modeled whole-instance CPU integer throughput only—not application performance, memory bandwidth, I/O, or latency.</span>'
      : "";
    button.innerHTML =
      '<span class="tier-card-top"><span class="tier-name">' + escapeHtml(labels) + "</span>" +
        badgeHTML(meta.cls, meta.label) + "</span>" +
      '<span class="tier-target">' + escapeHtml(option.targetType) + "</span>" +
      '<span class="tier-savings">' + fmtMoney(option.monthlySavings) + "/mo savings</span>" +
      performanceGain +
      '<span class="tier-metrics">' +
        '<span><span class="tier-metric-label">Projected utilization</span><span class="tier-metric-value mono">' + Math.round(option.projectedUtil * 100) + "%</span></span>" +
        '<span><span class="tier-metric-label">Binding dimension</span><span class="tier-metric-value">Limited by ' + escapeHtml(option.bindingDimension) + "</span></span>" +
      "</span>" +
      performanceCaveat;
    button.addEventListener("click", () => {
      selectedTierByInstance[inst.id] = tierName;
      renderDetail();
    });
    grid.appendChild(button);
  });

  TIER_ORDER.filter((name) => !inst.tiers[name]).forEach((name) => {
    const unavailable = el("div", "tier-card unavailable");
    unavailable.innerHTML = '<span class="tier-name">' + titleCase(name) + '</span>' +
      '<span class="tier-metric-value">No option at this headroom</span>';
    grid.appendChild(unavailable);
  });
  section.appendChild(grid);
  return section;
}

/* ---- 4.1 decision header ---- */
function buildDecisionHeader(inst) {
  const meta = CLASSIFICATION_META[inst.classification];
  const card = el("div", "card");
  const head = el("div", "decision-head");

  const left = el("div");
  left.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
      '<h2 style="font-size:1.1875rem;">' + escapeHtml(inst.id) + "</h2>" +
      badgeHTML(meta.cls, meta.label) +
    "</div>" +
    '<div class="decision-id">' +
      '<span class="mono">' + escapeHtml(inst.resourceId) + "</span> · " + escapeHtml(inst.region) + " · " + escapeHtml(inst.state) +
    "</div>";
  const types = el("div", "decision-types");
  if (inst.targetType) {
    types.innerHTML =
      '<span class="mono">' + escapeHtml(inst.currentType) + '</span><span class="arrow">→</span><span class="mono">' + escapeHtml(inst.targetType) + "</span>";
    left.appendChild(types);
    const spec = el("div", "decision-spec", escapeHtml(inst.currentSpec) + " → " + escapeHtml(inst.targetSpec));
    left.appendChild(spec);
  } else {
    types.innerHTML = '<span class="mono">' + escapeHtml(inst.currentType) + "</span>";
    left.appendChild(types);
    left.appendChild(el("div", "decision-spec", escapeHtml(inst.currentSpec || "")));
  }
  head.appendChild(left);

  const right = el("div", "savings-block");
  if (inst.classification === "DEFERRED") {
    right.innerHTML =
      '<div class="savings-figure" style="color:var(--ink-muted);font-size:1.25rem;">No recommendation</div>' +
      '<div class="savings-reason">' + escapeHtml((inst.deferredReasonCodes || []).join(", ")) + "</div>";
  } else {
    right.innerHTML =
      '<div class="savings-figure positive">' + fmtMoney(inst.monthlySavings) + "/mo</div>" +
      '<div class="savings-sub">' + fmtMoney(inst.yearlySavings) + "/yr · " + inst.savingsPercent + "% reduction</div>";
  }
  head.appendChild(right);

  card.appendChild(head);
  if (
    inst.selectedTier &&
    inst.performanceChangePct != null &&
    inst.performanceChangePct <= 0
  ) {
    card.appendChild(el(
      "div",
      "decision-spec",
      "Modeled whole-instance CPU throughput: " +
        fmtPerformanceChange(inst.performanceChangePct) +
        " vs current. This capacity detail is not application performance; projected utilization is the headroom signal."
    ));
  }
  return card;
}

/* ---- banners ---- */
function buildBanner(kind, title, body) {
  const b = el("div", "banner banner-" + kind);
  b.innerHTML =
    '<div class="banner-icon">' + (kind === "warning" ? warningIcon() : infoDotIcon()) + "</div>" +
    '<div><div class="banner-title">' + escapeHtml(title) + '</div><div class="banner-body">' + escapeHtml(body) + "</div></div>";
  return b;
}
function warningIcon() {
  return '<svg viewBox="0 0 20 20" width="20" height="20" fill="none"><path d="M10 2.5 18 17H2z" stroke="var(--warning)" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4" stroke="var(--warning)" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.6" r="0.9" fill="var(--warning)"/></svg>';
}
function infoDotIcon() {

/* ---- 4.2 why this recommendation: summary + evidence chart (merged) ----
   The headroom sentence and Chart A live in one card, in that order, so the
   claim is immediately visually checkable rather than asserted and then
   found later in a separate "evidence" section. */
function buildWhyCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Why this recommendation"));
  const p = el("div", "headroom-sentence");
  p.innerHTML = headroomSentence(inst);
  card.appendChild(p);

  const dw = inst.decisionWindow && inst.decisionWindow.cpu_percent;
  const targetMode = !!(dw && dw.headroomX && inst.targetType);

  const legend = el("div", "chart-legend");
  const suffix = targetMode ? " (on target)" : " (daily)";
  legend.innerHTML =
    '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);height:3px;"></span>Maximum' + suffix + '</span>' +
    '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);opacity:0.55;height:2px;"></span>p99' + suffix + '</span>' +
    '<span class="chart-legend-item"><span class="swatch dashedline"></span>p95' + suffix + '</span>';
  card.appendChild(legend);

  const scroll = el("div", "chart-scroll");
  const wrap = el("div", "chart-wrap");
  wrap.style.height = "300px";
  scroll.appendChild(wrap);
  card.appendChild(scroll);
  const caption = el("div", "chart-caption",
    targetMode
      ? "Rescaled to the recommended target — 100% is the target's ceiling, so the gap between the lines and that line is the headroom. Hover for both the target-scaled and the originally observed value."
      : "% of the current instance's own capacity — no target was evaluated, so there is nothing to rescale against. Hover to inspect any day.");
  card.appendChild(caption);

  requestAnimationFrame(() => renderTrendChart(wrap, {
    profile: inst.profile,
    dw: inst.decisionWindow && inst.decisionWindow.cpu_percent,
    targetType: inst.targetType,
    metric: "CPU",
  }));

  if (inst.classification === "CONDITIONAL") {
    const w = (inst.warnings || [])[0];
    if (w) {
      const note = el("div", "headroom-sentence", "");
      note.style.color = "var(--ink-secondary)";
      note.textContent = w.message;
      card.appendChild(note);
    }
  }
  if (inst.classification === "OPPORTUNITY") {
    const note = el("div", "headroom-sentence");
    note.style.color = "var(--ink-secondary)";
    note.textContent = "This is an architecture migration (x86 → Graviton/ARM), not a drop-in resize — it requires the validation steps below before it can be applied.";
    card.appendChild(note);
    if (inst.validationSteps) {
      card.appendChild(el("div", "eyebrow", "Required validation"));
      const ul = el("ul", "checklist");
      inst.validationSteps.forEach((s) => ul.appendChild(el("li", null, escapeHtml(s))));
      card.appendChild(ul);
    }
  }
  return card;
}

/* ---- 4.2b memory sibling — 15-month memory trend (spec §5.1a).
   Rendered beside the CPU trend, never overlaid (two capacity scales on one
   plot is the dual-axis honesty mistake). Empty-state when no agent series;
   short history is shown honestly, not padded to 15 months. ---- */
function buildMemoryChart(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Memory — 15-month trend"));
  const mem = inst.memory;
  if (!mem || !mem.present) {
    card.appendChild(el("div", "mem-empty",
      "No memory telemetry — memory utilization needs the CloudWatch agent. Compute sizing used the conservative fallback (the target keeps at least the current memory)."));
    return card;
  }
  const memSentence = memoryHeadroomSentence(mem, inst);
  if (memSentence) {
    const p = el("div", "headroom-sentence");
    p.innerHTML = memSentence;
    card.appendChild(p);
  }
  const targetMode = !!(mem.decisionWindow && mem.decisionWindow.headroomX && inst.targetType);
  const legend = el("div", "chart-legend");
  const suffix = targetMode ? " (on target)" : " (daily)";
  legend.innerHTML =
    '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);height:3px;"></span>Maximum' + suffix + '</span>' +
    '<span class="chart-legend-item"><span class="swatch" style="background:var(--accent);opacity:0.55;height:2px;"></span>p99' + suffix + '</span>' +
    '<span class="chart-legend-item"><span class="swatch dashedline"></span>p95' + suffix + '</span>';
  card.appendChild(legend);
  const scroll = el("div", "chart-scroll");
  const wrap = el("div", "chart-wrap");
  wrap.style.height = "300px";
  scroll.appendChild(wrap);
  card.appendChild(scroll);
  const days = Math.round(mem.profile.daysAvailable || TOTAL_DAYS);
  card.appendChild(el("div", "chart-caption",
    "Memory is a percentage gauge, so daily Max is an honest ceiling — same construction as the CPU trend. About " + days +
    " days of agent data are available; the line is plotted only where data exists, never padded to 15 months."));
  requestAnimationFrame(() => renderTrendChart(wrap, {
    profile: mem.profile,
    dw: mem.decisionWindow,
    targetType: inst.targetType,
    metric: "memory",
  }));
  return card;
}

function headroomSentence(inst) {
  if (inst.classification === "DEFERRED") {
    return "No target was evaluated for this instance — see the notice above for why it’s out of scope in V1.";
  }
  const dw = inst.decisionWindow && inst.decisionWindow.cpu_percent;
  const b15 = inst.buckets && inst.buckets["15mo"];
  const peak = b15 && b15.maximum != null ? b15.maximum : (dw ? dw.max : null);
  if (dw == null) return "";
  let s = "Over the last 15 months, max CPU was <strong class=\"mono\">" + peak + "%</strong>";
  if (b15 && b15.p99 != null) s += " (p99 <strong class=\"mono\">" + b15.p99 + "%</strong>)";
  s += ".";
  if (inst.targetType) {
    s += " The recommended <strong class=\"mono\">" + escapeHtml(inst.targetType) + "</strong> leaves ~<strong class=\"mono\">" + dw.headroomX + "×</strong> headroom against even that peak — see it plotted below.";
  }
  return s;
}

function memoryHeadroomSentence(mem, inst) {
  if (!mem || !mem.present) return "";
  const dw = mem.decisionWindow;
  if (!dw) return "";
  const days = Math.round((mem.profile && mem.profile.daysAvailable) || TOTAL_DAYS);
  let s = "Over the last ~" + days + " days of memory data, max was <strong class=\"mono\">" + dw.max + "%</strong>";
  if (dw.p99 != null) s += " (p99 <strong class=\"mono\">" + dw.p99 + "%</strong>)";
  s += ".";
  if (inst.targetType && dw.headroomX) {
    s += " The target leaves ~<strong class=\"mono\">" + dw.headroomX + "×</strong> headroom.";
  }
  return s;
}

/* ---- 4.4 risk grid ---- */
function buildRiskCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Risk by dimension"));
  const grid = el("div", "risk-grid");
  const dims = ["telemetry", "compute", "memory", "network", "storage", "compatibility", "migration"];
  dims.forEach((d) => {
    const cell = el("div", "risk-cell");
    cell.innerHTML = '<span class="risk-cell-label">' + d + "</span>" + riskBadge(inst.risk[d]);
    grid.appendChild(cell);
  });
  const overall = el("div", "risk-cell overall");
  overall.innerHTML = '<span class="risk-cell-label">Overall</span>' + riskBadge(inst.risk.overall);
  grid.appendChild(overall);
  card.appendChild(grid);

  const note = el("div", "decision-spec", "Overall = highest of the seven dimensions. A HIGH dimension routes to CONDITIONAL review — it does not reject the candidate.");
  card.appendChild(note);

  if (inst.reasonCodes && inst.reasonCodes.length) {
    const tags = el("div", "reason-codes");
    inst.reasonCodes.forEach((c) => tags.appendChild(el("span", "tag mono", escapeHtml(c))));
    card.appendChild(tags);
  }
  return card;
}

/* ---- Chart A: 15-month trend, rescaled to the target's capacity when one
   exists. Never a dual-axis chart — one scale is picked per render. In
   target mode the scaled peak always lands at exactly 100/headroomX, so the
   chart and the headroom sentence above it are always in agreement. ---- */
function renderTrendChart(container, cfg) {
  const rawSeries = generateDailySeries(cfg.profile);
  const dw = cfg.dw;
  const targetMode = !!(dw && dw.headroomX && cfg.targetType);
  const metricLabel = cfg.metric || "CPU";

  let observedPeak = 0;
  rawSeries.forEach((p) => { if (p && p.maximum > observedPeak) observedPeak = p.maximum; });
  const targetPeakPct = targetMode ? round1(100 / dw.headroomX) : null;
  const scale = targetMode && observedPeak > 0 ? targetPeakPct / observedPeak : 1;

  const series = rawSeries.map((p) => !p ? null : {
    maximum: round1(p.maximum * scale), p99: round1(p.p99 * scale), p95: round1(p.p95 * scale),
    rawMaximum: p.maximum, rawP99: p.p99, rawP95: p.p95,
  });

  const width = Math.max(container.clientWidth, 640);
  const height = 300;
  const pad = { top: 18, right: 18, bottom: 30, left: 40 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;

  let yMax;
  if (targetMode) {
    yMax = 100;
  } else {
    yMax = 10;
    series.forEach((p) => { if (p && p.maximum > yMax) yMax = p.maximum; });
    yMax = Math.ceil((yMax * 1.15) / 10) * 10;
  }

  const xFor = (i) => pad.left + (i / (TOTAL_DAYS - 1)) * innerW;
  const yFor = (v) => pad.top + innerH - (v / yMax) * innerH;

  function pathFor(key) {
    let d = ""; let drawing = false;
    series.forEach((p, i) => {
      if (!p || p[key] == null) { drawing = false; return; }
      const cmd = (drawing ? " L " : "M ") + xFor(i).toFixed(1) + "," + yFor(p[key]).toFixed(1);
      d += cmd; drawing = true;
    });
    return d;
  }
  function areaPathFor(key) {
    let runs = []; let cur = null;
    series.forEach((p, i) => {
      if (!p || p[key] == null) { if (cur) { runs.push(cur); cur = null; } return; }
      if (!cur) cur = [];
      cur.push([xFor(i), yFor(p[key]), i]);
    });
    if (cur) runs.push(cur);
    return runs.map((run) => {
      const top = run.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" L ");
      const baseY = yFor(0).toFixed(1);
      const x0 = run[0][0].toFixed(1);
      const x1 = run[run.length - 1][0].toFixed(1);
      return "M " + x0 + "," + baseY + " L " + top + " L " + x1 + "," + baseY + " Z";
    }).join(" ");
  }

  // risk bands (target mode only): 0-40 low, 40-70 medium, 70-100 high
  let bands = "";
  let ceiling = "";
  if (targetMode) {
    const yTop = yFor(100), yMedTop = yFor(70), yLowTop = yFor(40), yBottom = yFor(0);
    bands =
      '<rect x="' + pad.left + '" y="' + yTop.toFixed(1) + '" width="' + innerW + '" height="' + (yMedTop - yTop).toFixed(1) + '" fill="var(--critical)" opacity="0.06"/>' +
      '<rect x="' + pad.left + '" y="' + yMedTop.toFixed(1) + '" width="' + innerW + '" height="' + (yLowTop - yMedTop).toFixed(1) + '" fill="var(--warning)" opacity="0.07"/>' +
      '<rect x="' + pad.left + '" y="' + yLowTop.toFixed(1) + '" width="' + innerW + '" height="' + (yBottom - yLowTop).toFixed(1) + '" fill="var(--good)" opacity="0.05"/>';
    ceiling =
      '<line x1="' + pad.left + '" x2="' + (width - pad.right) + '" y1="' + yTop.toFixed(1) + '" y2="' + yTop.toFixed(1) + '" stroke="var(--ink-primary)" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.55"/>' +
      '<text x="' + (width - pad.right) + '" y="' + (yTop - 6).toFixed(1) + '" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink-primary)">target capacity ceiling (100%)</text>';
  }

  // gridlines: 5 horizontal steps
  let gridlines = "";
  const steps = 5;
  for (let s = 0; s <= steps; s++) {
    const v = (yMax / steps) * s;
    const y = yFor(v);
    gridlines += '<line x1="' + pad.left + '" x2="' + (width - pad.right) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
    gridlines += '<text x="' + (pad.left - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--ink-muted)">' + Math.round(v) + "%</text>";
  }

  // x-axis: month ticks every ~30 days
  let xTicks = "";
  const today = new Date();
  for (let i = TOTAL_DAYS - 1; i >= 0; i -= 61) {
    const d = new Date(today.getTime() - (TOTAL_DAYS - 1 - i) * 86400000);
    const label = d.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
    const x = xFor(i);
    xTicks += '<text x="' + x.toFixed(1) + '" y="' + (height - pad.bottom + 18) + '" text-anchor="middle" font-size="10" fill="var(--ink-muted)">' + label + "</text>";
  }

  // peak annotation — in target mode this is a static (always-visible, not
  // hover-only) callout showing the current peak translating to the target's
  // scale, so the reader sees the transformation without hovering for it.
  let peakIdx = -1, peakVal = -Infinity;
  series.forEach((p, i) => { if (p && p.maximum > peakVal) { peakVal = p.maximum; peakIdx = i; } });
  let peakAnnotation = "";
  if (peakIdx >= 0) {
    const px = xFor(peakIdx), py = yFor(peakVal);
    const anchor = px > width - 90 ? "end" : "middle";
    if (targetMode) {
      const rawPeak = series[peakIdx].rawMaximum;
      const flip = (py - 24) < pad.top; // not enough room above the plot area; drop below the dot instead
      const y1 = flip ? py + 15 : py - 24;
      const y2 = flip ? py + 28 : py - 11;
      peakAnnotation =
        '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
        '<text x="' + px.toFixed(1) + '" y="' + y1.toFixed(1) + '" text-anchor="' + anchor + '" font-size="9" fill="var(--ink-muted)">current peak: ' + rawPeak + "%</text>" +
        '<text x="' + px.toFixed(1) + '" y="' + y2.toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" font-weight="700" fill="var(--ink-primary)">→ ' + peakVal + "% on target</text>";
    } else {
      peakAnnotation =
        '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
        '<text x="' + px.toFixed(1) + '" y="' + (py - 10).toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" font-weight="700" fill="var(--ink-primary)">peak ' + peakVal + "%</text>";
    }
  }

  // last point marker
  let lastIdx = -1;
  for (let i = TOTAL_DAYS - 1; i >= 0; i--) { if (series[i]) { lastIdx = i; break; } }
  let lastMarker = "";
  if (lastIdx >= 0) {
    const lx = xFor(lastIdx), ly = yFor(series[lastIdx].maximum);
    lastMarker = '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  }

  const svg =
    '<svg class="chart-svg" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="15-month daily ' + metricLabel + ' maximum, p99 and p95' + (targetMode ? ", rescaled to target capacity" : "") + '">' +
      bands + gridlines + xTicks +
      '<path d="' + areaPathFor("maximum") + '" fill="var(--accent)" opacity="0.08" stroke="none"/>' +
      '<path d="' + pathFor("p95") + '" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>' +
      '<path d="' + pathFor("p99") + '" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.55"/>' +
      '<path d="' + pathFor("maximum") + '" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>' +
      ceiling + peakAnnotation + lastMarker +
      '<line x1="0" x2="0" y1="' + pad.top + '" y2="' + (height - pad.bottom) + '" stroke="var(--ink-muted)" stroke-width="1" class="crosshair" style="opacity:0;"/>' +
    "</svg>";

  container.innerHTML = svg;
  const tooltip = el("div", "tooltip");
  container.appendChild(tooltip);
  const svgEl = container.querySelector("svg");
  const crosshair = container.querySelector(".crosshair");

  function handleMove(evt) {
    const rect = svgEl.getBoundingClientRect();
    const scaleX = width / rect.width;
    const px = (evt.clientX - rect.left) * scaleX;
    let idx = Math.round(((px - pad.left) / innerW) * (TOTAL_DAYS - 1));
    idx = clamp(idx, 0, TOTAL_DAYS - 1);
    const p = series[idx];
    const cx = xFor(idx);
    crosshair.setAttribute("x1", cx.toFixed(1));
    crosshair.setAttribute("x2", cx.toFixed(1));
    crosshair.style.opacity = "1";
    if (!p) {
      tooltip.classList.remove("visible");
      return;
    }
    const d = new Date(today.getTime() - (TOTAL_DAYS - 1 - idx) * 86400000);
    let rows =
      '<div class="t-row"><span>Maximum</span><span class="t-val">' + p.maximum + '%</span></div>' +
      '<div class="t-row"><span>p99</span><span class="t-val">' + p.p99 + '%</span></div>' +
      '<div class="t-row"><span>p95</span><span class="t-val">' + p.p95 + '%</span></div>';
    if (targetMode) {
      rows += '<div class="t-row"><span>Observed (current instance)</span><span class="t-val">' + p.rawMaximum + '%</span></div>';
    }
    tooltip.innerHTML =
      '<div class="t-date">' + d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + "</div>" + rows;
    const scaleFactor = rect.width / width;
    let left = cx * scaleFactor + 12;
    if (left > rect.width - 160) left = cx * scaleFactor - 172;
    tooltip.style.left = left.toFixed(0) + "px";
    tooltip.style.top = "8px";
    tooltip.classList.add("visible");
  }
  svgEl.addEventListener("pointermove", handleMove);
  svgEl.addEventListener("pointerleave", () => {
    tooltip.classList.remove("visible");
    crosshair.style.opacity = "0";
  });
}

/* ---- 4.4b Chart B: lookback buckets ---- */
const BUCKET_ORDER = ["30d", "90d", "120d", "6mo", "12mo", "15mo"];
const BUCKET_LABELS = { "30d": "30 days", "90d": "90 days", "120d": "120 days", "6mo": "6 months", "12mo": "12 months", "15mo": "15 months" };

function buildBucketCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Lookback summary"));
  const grid = el("div", "bucket-grid");
  let globalMax = 1;
  BUCKET_ORDER.forEach((k) => { const b = inst.buckets[k]; if (b && b.maximum != null) globalMax = Math.max(globalMax, b.maximum); });

  BUCKET_ORDER.forEach((k) => {
    const b = inst.buckets[k];
    const cell = el("div", "bucket-card");
    cell.appendChild(el("div", "bucket-label", BUCKET_LABELS[k]));
    if (!b || b.maximum == null) {
      cell.appendChild(el("div", "bucket-empty", "Not enough history yet"));
      grid.appendChild(cell);
      return;
    }
    cell.appendChild(el("div", "bucket-max", b.maximum + "%"));
    const meter = el("div", "bucket-meter");
    meter.innerHTML = '<span style="width:' + Math.round((b.maximum / globalMax) * 100) + '%"></span>';
    cell.appendChild(meter);
    if (b.p99 != null) {
      cell.appendChild(el("div", "bucket-percentiles", "p99 " + b.p99 + "% · p95 " + b.p95 + "%"));
    } else {
      cell.appendChild(el("div", "bucket-percentiles na", "percentiles n/a"));
    }
    if (b.note) cell.appendChild(el("div", "bucket-empty", b.note));
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  card.appendChild(el("div", "bucket-footnote",
    "Maximum — trailing window, computed from the daily series. Percentiles — latest complete, epoch-aligned window; shown as n/a when no complete window exists yet (typical for 12+ month buckets)."));
  return card;
}

/* ---- 4.4c Chart C: decision-window bars ---- */
const LANES = [
  { key: "cpu_percent", label: "CPU %", unit: "%" },
  { key: "network_in_mbps", label: "Network in", unit: "Mbps" },
  { key: "network_out_mbps", label: "Network out", unit: "Mbps" },
  { key: "ebs_iops", label: "EBS IOPS", unit: "IOPS" },
  { key: "ebs_mibps", label: "EBS throughput", unit: "MiB/s" },
];

/* §4.2's 60-day network reassurance line — separate from the 15-month CPU
   headroom sentence, one line per direction, sitting next to Chart C's bars. */
function networkReassuranceSentence(lane, d) {
  const peak = d.max != null ? d.max : d.p99;
  const hasBurstModel = d.targetPeak != null && d.targetBaseline != null &&
    d.capacityKind !== "BURST_OR_UP_TO" && d.capacityKind !== "UNKNOWN";
  if (hasBurstModel) {
    const pct = Math.round((d.p99 / d.targetBaseline) * 100);
    const assumedNote = d.capacityKind === "ASSUMED_BASELINE" ? " (estimated, not published)" : "";
    const verdict = d.p99 >= d.targetPeak
      ? "At or beyond burst capacity — review."
      : d.p99 >= d.targetBaseline
        ? "Sustained demand relies on time-limited burst capacity above baseline — review."
        : pct < 70 ? "Ample headroom." : "Adequate headroom, worth monitoring.";
    return "Over the last 60 days, " + lane.label + " peaked at <strong class=\"mono\">" + peak + " Mbps</strong> (p99 <strong class=\"mono\">" +
      d.p99 + "</strong>) — about <strong class=\"mono\">" + pct + "%</strong> of the target's <strong class=\"mono\">" + d.targetBaseline +
      " Mbps</strong> baseline" + assumedNote + ", with burst to <strong class=\"mono\">" + d.targetPeak + " Mbps</strong> available. " + verdict;
  }
  return "Over the last 60 days, " + lane.label + " peaked at <strong class=\"mono\">" + peak +
    " Mbps</strong> (p99 <strong class=\"mono\">" + d.p99 + "</strong>) — the target's network capacity is burst/“up to” rated" +
    (d.targetLabel ? " (" + escapeHtml(d.targetLabel) + ")" : "") + "; sustained demand can't be proven against a numeric baseline.";
}

function buildDecisionWindowCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Decision-window utilization (last 60 days) vs. target capacity"));
  const networkLanes = LANES.filter((lane) => lane.key.indexOf("network") === 0);
  const dw = inst.decisionWindow || {};
  const reassuranceLines = networkLanes
    .filter((lane) => dw[lane.key])
    .map((lane) => networkReassuranceSentence(lane, dw[lane.key]));
  if (reassuranceLines.length) {
    const note = el("div", "headroom-sentence");
    note.innerHTML = reassuranceLines.map((line) => "<div>" + line + "</div>").join("");
    card.appendChild(note);
  }
  const list = el("div", "lane-list");

  LANES.forEach((lane) => {
    const d = inst.decisionWindow && inst.decisionWindow[lane.key];
    if (!d) return;
    const row = el("div", "lane");
    row.appendChild(el("div", "lane-label", lane.label));
    const barRow = el("div", "lane-bar-row");
    const track = el("div", "lane-track");

    if (lane.key === "cpu_percent") {
      const pct = clamp(d.p99, 2, 100);
      const cls = pct < 40 ? "good" : pct < 70 ? "warning" : "critical";
      track.innerHTML = '<div class="lane-fill ' + cls + '" style="width:' + pct + '%"></div>';
      barRow.appendChild(track);
      row.appendChild(barRow);
      const val = el("div", "lane-value");
      val.innerHTML = '<span>p99 <span class="mono">' + d.p99 + "%</span> · max <span class=\"mono\">" + d.max + '%</span></span><span class="mono">~' + d.headroomX + "× headroom</span>";
      row.appendChild(val);
    } else if (
      lane.key.indexOf("network") === 0 && d.targetPeak != null && d.targetBaseline != null &&
      d.capacityKind !== "BURST_OR_UP_TO" && d.capacityKind !== "UNKNOWN"
    ) {
      // §5.3 baseline-anchored bar (capacity_kind BASELINE | ASSUMED_BASELINE):
      // baseline fixed at 70% of the track, peak at the far right. Left of
      // baseline = safe; baseline→peak = amber burst zone.
      const BL = 70;
      const posFor = (v) => v <= d.targetBaseline
        ? (v / d.targetBaseline) * BL
        : BL + Math.min((v - d.targetBaseline) / (d.targetPeak - d.targetBaseline), 1) * (100 - BL);
      const p99x = clamp(posFor(d.p99), 1.5, 100);
      const overBaseline = d.p99 >= d.targetBaseline;
      const atPeak = d.p99 >= d.targetPeak;
      const cls = atPeak ? "critical" : overBaseline ? "warning" : "good";
      const assumed = d.capacityKind === "ASSUMED_BASELINE";
      let inner =
        '<div class="lane-burst-zone" style="left:' + BL + '%;right:0;"></div>' +
        '<div class="lane-marker" style="left:' + (0.40 * BL).toFixed(0) + '%;"></div>' +
        '<div class="lane-marker" style="left:' + (0.70 * BL).toFixed(0) + '%;"></div>' +
        '<div class="lane-fill ' + cls + '" style="width:' + p99x.toFixed(1) + '%"></div>' +
        '<div class="lane-baseline-line' + (assumed ? ' assumed' : '') + '" style="left:' + BL + '%"></div>' +
        '<div class="lane-marker-label" style="left:' + BL + '%">baseline' + (assumed ? " (est.)" : "") + '</div>' +
        '<div class="lane-peak-line" style="right:0;"></div>' +
        '<div class="lane-marker-label" style="left:97%">peak</div>';
      if (d.max != null) {
        inner += '<div class="lane-max-tick" style="left:' + clamp(posFor(d.max), 1.5, 100).toFixed(1) + '%"></div>';
      }
      track.innerHTML = inner;
      barRow.appendChild(track);
      row.appendChild(barRow);
      const val = el("div", "lane-value");
      const maxTxt = d.max != null ? ' · max <span class="mono">' + d.max + " " + lane.unit + '</span>' : "";
      const verdict = atPeak ? "at/over peak" : overBaseline ? "above baseline — burst" : Math.round((d.p99 / d.targetBaseline) * 100) + "% of baseline";
      val.innerHTML = '<span>p99 <span class="mono">' + d.p99 + " " + lane.unit + '</span>' + maxTxt + "</span>" +
        '<span class="mono">' + escapeHtml(verdict) + (assumed ? " · est. baseline" : "") + "</span>";
      row.appendChild(val);
    } else if (lane.key.indexOf("network") === 0) {
      // capacity_kind BURST_OR_UP_TO / UNKNOWN (or no numeric peak at all): no
      // proven ceiling to compare against — show "capacity approximate" and
      // never fake a ratio (spec §5.3's third data case).
      track.innerHTML = '<div class="lane-fill approx" style="width:38%"></div>' +
        '<span style="position:absolute;left:8px;top:1px;font-size:0.6875rem;font-weight:700;color:var(--ink-secondary);">≈ capacity approximate</span>';
      barRow.appendChild(track);
      row.appendChild(barRow);
      const val = el("div", "lane-value");
      const maxTxt = d.max != null ? ' · max <span class="mono">' + d.max + " " + lane.unit + '</span>' : "";
      val.innerHTML = '<span>p99 <span class="mono">' + d.p99 + " " + lane.unit + '</span>' + maxTxt + "</span><span class=\"approx-note\">target: " + escapeHtml(d.targetLabel || "burst / “up to”") + "</span>";
      row.appendChild(val);
    } else if (d.targetBaseline == null) {
      track.innerHTML = '<div class="lane-fill approx" style="width:38%"></div>' +
        '<span style="position:absolute;left:8px;top:1px;font-size:0.6875rem;font-weight:700;color:var(--ink-secondary);">≈ capacity approximate</span>';
      barRow.appendChild(track);
      row.appendChild(barRow);
      const val = el("div", "lane-value");
      val.innerHTML = '<span>p99 <span class="mono">' + d.p99 + " " + lane.unit + '</span></span><span class="approx-note">target: ' + escapeHtml(d.targetLabel || "burst / “up to”") + "</span>";
      row.appendChild(val);
    } else {
      const ratio = (d.p99 / d.targetBaseline) * 100;
      const cls = ratio < 40 ? "good" : ratio < 70 ? "warning" : "critical";
      track.innerHTML =
        '<div class="lane-fill ' + cls + '" style="width:' + clamp(ratio, 2, 100) + '%"></div>' +
        '<div class="lane-marker" style="left:40%;"></div><div class="lane-marker-label" style="left:40%;">40%</div>' +
        '<div class="lane-marker" style="left:70%;"></div><div class="lane-marker-label" style="left:70%;">70%</div>';
      barRow.appendChild(track);
      row.appendChild(barRow);
      const val = el("div", "lane-value");
      val.innerHTML = '<span>p99 <span class="mono">' + d.p99 + " " + lane.unit + '</span> of <span class="mono">' + d.targetBaseline + " " + lane.unit + '</span> baseline</span><span class="mono">' + ratio.toFixed(0) + "%</span>";
      row.appendChild(val);
    }
    list.appendChild(row);
  });

  card.appendChild(list);
  card.appendChild(el("div", "decision-spec",
    "Network lanes are baseline-anchored: the solid bar is sustained p99, the vertical tick is the 60-day max, the marked line is the target’s guaranteed baseline (dashed = estimated), and the amber zone runs from baseline to the “up to” peak — a bar reaching into it relies on time-limited burst. CPU/EBS lanes show p99 vs. baseline with 40%/70% risk bands. Hatched bars mean capacity is only burst/“up to” rated, not a proven ceiling."));
  return card;
}

/* ---- 4.5 warnings ---- */
function buildWarningsCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Warnings &amp; required review"));
  if (!inst.warnings || inst.warnings.length === 0) {
    card.appendChild(el("div", "empty-note", inst.classification === "DEFERRED" ? "Not evaluated — this instance was deferred before warning evaluation." : "No warnings. This candidate cleared every network, EBS, and compatibility check with low risk."));
    return card;
  }
  const list = el("div", "warning-list");
  inst.warnings.forEach((w) => {
    const item = el("div", "warning-item");
    item.innerHTML = '<div class="warning-code mono">' + escapeHtml(w.code) + '</div><div class="warning-message">' + escapeHtml(w.message) + "</div>";
    list.appendChild(item);
  });
  card.appendChild(list);
  return card;
}

/* ---- 4.6 telemetry disclosure ---- */
function buildTelemetryCard(inst) {
  const card = el("div", "card");
  card.appendChild(el("div", "eyebrow", "Telemetry disclosure"));
  const grid = el("div", "telemetry-grid");
  const labels = { cpu_percent: "CPU utilization", network_in_mbps: "Network in", network_out_mbps: "Network out" };
  Object.keys(inst.telemetry || {}).forEach((k) => {
    const t = inst.telemetry[k];
    const cell = el("div", "telemetry-cell" + (t.thin_data ? " thin" : ""));
    cell.innerHTML =
      '<div class="telemetry-metric">' + labels[k] + "</div>" +
      '<div class="telemetry-days">~' + t.observed_days + " days</div>" +
      (t.thin_data ? '<div class="telemetry-flag"><span class="dot"></span>Under 7 days — limited confidence</div>' : '<div class="decision-spec">present, considered in full</div>');
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  card.appendChild(el("div", "decision-spec", "Disclosure only — this never blocks a recommendation. You decide whether the observed history is enough to act on."));
  return card;
}

/* ---- 4.7 coverage & caveats ---- */
function buildCoverageCard(inst) {
  const details = document.createElement("details");
  details.className = "card";
  const summary = document.createElement("summary");
  summary.innerHTML = '<span class="eyebrow" style="margin:0;">Coverage &amp; caveats</span><span class="chev">›</span>';
  details.appendChild(summary);

  const body = el("div", "coverage-body");
  const cov = inst.coverage || {};
  const covGrid = el("div", "coverage-grid");
  const rows = [
    ["Numeric network baseline known", cov.numericNetworkBaseline],
    ["Reliable network maximum known", cov.reliableNetworkMax],
    ["EBS attachment limit known", cov.ebsAttachmentLimit],
  ];
  rows.forEach(([k, v]) => {
    const row = el("div", "coverage-row");
    row.innerHTML = '<span class="k">' + k + '</span><span class="v ' + (v ? "yes" : "no") + '">' + (v ? "Yes" : "No") + "</span>";
    covGrid.appendChild(row);
  });
  const srcRow = el("div", "coverage-row");
  srcRow.innerHTML = '<span class="k">Capability source</span><span class="v mono">' + escapeHtml(cov.capabilitySource || "unknown") + "</span>";
  covGrid.appendChild(srcRow);
  const fixtureRow = el("div", "coverage-row");
  fixtureRow.innerHTML = '<span class="k">Mock catalog mode</span><span class="v mono">' + escapeHtml(inst.catalogMode || "FULLY_SYNTHETIC") + "</span>";
  covGrid.appendChild(fixtureRow);
  body.appendChild(covGrid);

  if (inst.scopePolicy) {
    body.appendChild(el("div", "decision-spec",
      "Scope policy: allow_unknown_instance_store_usage = " + String(inst.scopePolicy.allowUnknownInstanceStoreUsage) + "."));
  }
  body.appendChild(el("div", "decision-spec",
    "Instance availability and launch capacity are not validated by this recommendation. Confirm the target type is available before applying the change."));

  details.appendChild(body);
  return details;
}
