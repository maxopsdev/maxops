[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Output options
#
# WARNING FOR HUMANS AND LLM AGENTS: tests/integration/ provisions REAL,
# BILLABLE AWS resources (EC2, RDS, S3, EBS, ElastiCache, DynamoDB) via the
# `test_resources` fixture in tests/conftest.py. A broad `pytest -k "..."`
# run across the whole `tests/` tree WILL sweep these in if any keyword
# happens to match an integration test's path/class/function name (e.g.
# "ec2", "scan"), even though you only meant to run unrelated unit tests.
# `-m "not integration"` below makes that the safe default. To actually run
# integration tests, pass `-m integration` explicitly AND set
# MAXOPS_RUN_AWS_INTEGRATION_TESTS=1 (see tests/conftest.py) — both gates
# must be cleared on purpose; neither should ever be flipped incidentally.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not integration"

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring AWS resources
    unit: marks tests as unit tests (fast, no external dependencies)
    payload: offline payload-backed tests using checked-in AWS responses
    ec2: tests related to EC2 checks
    rds: tests related to RDS checks
    s3: tests related to S3 checks
    ebs: tests related to EBS checks
    elasticache: tests related to ElastiCache checks
    dynamodb: tests related to DynamoDB checks
    actions: tests that execute actions on AWS resources

# Minimum Python version
minversion = 3.8

# Timeout for tests (in seconds)
timeout = 1800

# Fail on first error (useful for debugging)
# Uncomment to enable:
# addopts = -x
