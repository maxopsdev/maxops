services:
  backend:
    build: ./maxops-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Bare `VAR` (no `=`) passes the value through from the environment
      # `docker compose` runs in (including .env) and OMITS it entirely from
      # the container if unset -- unlike `VAR: ${VAR:-}`, which would set it
      # to an empty string. That distinction matters here: botocore treats
      # AWS_PROFILE="" as an explicit (invalid) profile name, not "no profile",
      # so a blank env var breaks every AWS call for anyone not using it.
      - AWS_PROFILE
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # The onboarding wizard writes a MaxOpsReadOnlyRole profile back to an
      # AWS config file once a role is created/registered (see aws-setup.md).
      # /root/.aws is mounted read-only below (on purpose -- the container
      # shouldn't be able to rewrite your real ~/.aws), so redirect the write
      # target into the backend-data volume, where it persists like the DBs.
      # AWS_CONFIG_FILE REPLACES ~/.aws/config, it does not add to it, so the
      # backend copies the mounted config into this file on startup and before
      # listing profiles. Without that copy botocore sees only the profiles in
      # ~/.aws/credentials and the picker shows `default` alone.
      - AWS_CONFIG_FILE=/app/data/aws/config
      - DATABASE_URL=sqlite:////app/data/maxops.db
      - PRICING_DATABASE_PATH=/app/data/maxops_pricing.db
      - MAXOPS_ENABLE_ACTIONS=${MAXOPS_ENABLE_ACTIONS:-false}
      - TEST_ACTION=${TEST_ACTION:-false}
    volumes:
      - backend-data:/app/data
      # Mounts your local AWS config/credentials into the container so
      # AWS_PROFILE works. Defaults to an empty placeholder dir (harmless) so
      # `docker compose up` works out of the box; set AWS_CONFIG_HOST_DIR in .env
      # to your real ~/.aws path to enable it — no editing this file required.
      #
      # Read-only by default: MaxOps should not be able to rewrite your real
      # ~/.aws, and it never needs to (AWS_CONFIG_FILE above redirects its one
      # write). IAM Identity Center (SSO) is the exception -- botocore renews
      # the cached SSO token in place and cannot do that on a read-only mount,
      # so those users set AWS_CONFIG_MOUNT_MODE=rw in .env.
      - ${AWS_CONFIG_HOST_DIR:-./.aws-empty}:/root/.aws:${AWS_CONFIG_MOUNT_MODE:-ro}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./maxops-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
